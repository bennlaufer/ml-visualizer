<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bidding War Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
<style>
  :root{
    --bg:#fbf6ee; --card:#ffffff; --ink:#1e2433; --soft:#5b6476; --faint:#9aa3b2; --rule:#ebe4d8;
    --line:#4f46e5; --line-soft:#e0e7ff; --hi:#e11d48; --hi-soft:#ffe4e9; --lo:#d97706; --lo-soft:#fff1d6;
    --best:#15803d; --best-soft:#dcfce7; --yes:#16a34a; --no:#f97316; --accent:#f97316;
  }
  html,body{background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif;}
  body{overflow-x:hidden; padding-bottom:84px;}
  h1,h2,h3,.disp{font-family:'Fredoka','Nunito',sans-serif;}
  .card-w{background:var(--card); border:1px solid var(--rule); border-radius:18px; box-shadow:0 1px 0 rgba(30,36,51,.04),0 6px 20px -12px rgba(30,36,51,.18);}
  /* progress */
  .prog{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px;}
  .pstep{display:flex; flex-direction:column; gap:5px; align-items:flex-start; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:var(--faint); font-size:12px; font-weight:700; min-width:0;}
  .pbar{height:6px; width:100%; border-radius:99px; background:#e7dfd1; overflow:hidden;}
  .pbar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .4s;}
  .pstep.done .pbar i{width:100%;} .pstep.cur .pbar i{width:100%; background:var(--line);}
  .pstep.done{color:var(--soft);} .pstep.cur{color:var(--line);}
  .plabel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  /* chart */
  #chart{width:100%; display:block; user-select:none; -webkit-user-select:none; overflow:visible;}
  #chart text{font-family:'Nunito',sans-serif;}
  #chart .halo{paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round;}
  .fadein{animation:fadein .5s ease both;} @keyframes fadein{from{opacity:0} to{opacity:1}}
  .popin{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;} @keyframes popin{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
  .drawline{stroke-dasharray:1; stroke-dashoffset:1; animation:drawline .9s ease-out forwards;} .drawline.slow{animation-duration:1.6s;}
  @keyframes drawline{to{stroke-dashoffset:0}}
  @keyframes blink{50%{opacity:.35}} .blink{animation:blink 1.2s ease-in-out infinite;}
  @keyframes shake{25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}
  .ping{transform-box:fill-box; transform-origin:center; animation:ping .6s ease;} @keyframes ping{40%{transform:scale(1.8)}}
  /* house cards */
  .cards{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x mandatory;}
  .hcard{flex:0 0 158px; scroll-snap-align:start; background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; transition:border-color .15s, box-shadow .15s;}
  @media (min-width:1024px){ .cards{display:grid; grid-template-columns:repeat(5,1fr); overflow:visible;} .hcard{flex:auto;} }
  .hsvg{width:100%; height:76px; display:block;}
  .hsize{font-family:'Fredoka'; font-weight:600; font-size:15px;}
  .hrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--soft); font-weight:700;}
  .hrow b{font-size:16px; color:var(--ink); font-weight:800;}
  .hrow b.g{color:var(--line);} .hrow b.ry{color:#166534;} .hrow b.rn{color:#9a3412;}
  .miss{font-size:12.5px; font-weight:800; border-radius:10px; padding:4px 8px; margin-top:2px; line-height:1.35;}
  .miss.hi{background:var(--hi-soft); color:#9f1239;} .miss.lo{background:var(--lo-soft); color:#92400e;} .miss.ok{background:var(--best-soft); color:#166534;}
  .miss.yes{background:#dcfce7; color:#166534;} .miss.no{background:#ffedd5; color:#9a3412;} .miss.wait{background:#f4efe6; color:var(--faint);}
  .hcard.cur{border-color:var(--line); box-shadow:0 0 0 3px #e0e7ff;}
  .flyr{position:fixed; z-index:70; pointer-events:none; width:20px; height:20px; border-radius:50%; background:#fff; border:3.5px solid var(--yes); box-shadow:0 6px 10px rgba(30,36,51,.25);}
  /* panel */
  .partbar{display:none;} body.wide .partbar{display:block; margin:2px 4px 8px;}
  .ptitle{font-family:'Fredoka'; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--accent);}
  .phead{font-family:'Fredoka'; font-size:24px; font-weight:600; line-height:1.15;}
  .task{font-size:14.5px; color:var(--soft); font-weight:600;}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; padding:4px 10px; border-radius:99px; background:#f3efe7; color:var(--soft);}
  .chip.ok{background:#dcfce7; color:#166534;} .chip.bad{background:#ffe4e9; color:#9f1239;}
  .choice{border:2px solid var(--rule); background:#fff; border-radius:14px; padding:9px 10px; font-weight:800; font-size:14px; cursor:pointer; transition:all .15s; text-align:center; line-height:1.25;}
  .choice:hover:not(:disabled){border-color:#a5b4fc;} .choice:disabled{cursor:default;}
  .choice.right{border-color:var(--best); background:var(--best-soft); color:#166534;}
  .choice.wrong{border-color:var(--hi); background:var(--hi-soft); color:#9f1239; animation:shake .35s;}
  .navrow{display:flex; gap:8px; align-items:center; justify-content:space-between; border-top:1px solid var(--rule); padding-top:12px; margin-top:auto;}
  .hintline{font-size:12.5px; color:var(--faint); font-weight:700; text-align:center; flex:1;}
  .btn-main{background:var(--line); color:#fff; border:0;}
  .btn-main:hover{background:#4338ca;}
  .btn-main:disabled,.btn-main[disabled]{background:#e7e2d9 !important; color:#a39a8b !important; border:0;}
  input[type=range]{accent-color:var(--line);}
  .preset{font-size:12.5px; font-weight:800; padding:6px 10px; border-radius:99px; border:1.5px solid var(--rule); background:#fff; cursor:pointer;}
  .preset:hover{border-color:var(--line);} .preset.on{background:var(--line); color:#fff; border-color:var(--line);}
  .tabnum{font-variant-numeric:tabular-nums;}
  @media (max-width:639px){ #chapChip{display:none;} }
  .fade-in{animation:fadein .4s ease both;}
  /* layouts */
  #flashStage{display:none;} body.flashmode #flashStage{display:block;}
  body.flashmode #chartCard, body.flashmode #panelWrap, body.flashmode #cardsSec{display:none;}
  body.flashmode #mainGrid{grid-template-columns:minmax(0,1fr);}
  body.wide #panelWrap{display:none;} body.wide #mainGrid{grid-template-columns:minmax(0,1fr);}
  .c1bar{display:none;}
  body.wide .c1bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; border-top:1px solid var(--rule); margin-top:8px; padding-top:12px;}
  body.replay #c1Bar{min-height:112px; align-items:flex-start;}
  @media (max-width:640px){ #c1Bar>*{flex-basis:100%;} }
  #cardsSec{grid-column:1/-1; order:2; min-width:0;}
  @media (min-width:1024px){
    body.wide #mainGrid{grid-template-columns:240px minmax(0,1fr);}
    body.wide #cardsSec{grid-column:auto; order:-1;}
    body.wide .cardshead{flex-direction:column; gap:2px;}
    body.wide .cards{grid-template-columns:1fr; gap:8px; padding:0;}
    body.wide .hcard{display:grid; grid-template-columns:78px minmax(0,1fr); column-gap:10px; row-gap:1px; align-items:center; padding:8px 10px;}
    body.wide .hcard .hsvg{grid-row:1/span 3; width:78px; height:56px;}
    body.wide .hcard>:not(.hsvg){grid-column:2;}
    body.wide .hcard .miss{grid-column:1/-1; margin-top:4px;}
    body.c5 #mainGrid{grid-template-columns:minmax(0,1fr) 260px;} body.c5 #panelWrap{padding:16px;}
    body.c6 #mainGrid{grid-template-columns:minmax(0,1fr) 380px;}
  }
  body.c6 #cardsSec, body.c5 #cardsSec, body.c6 .navrow, body.c5 .navrow{display:none;}
  body.wide .hcard.n8card{display:flex; flex-direction:column; align-items:stretch; padding:12px 14px;}
  body.wide .n8card .hsvg, .n8card .hsvg{width:100%; height:110px; grid-row:auto;} body.wide .n8card>*{grid-column:auto;}
  #eqBar{display:none;} body.showeq #eqBar{display:block;}
  #scoreStage{display:none;} body.nochart #scoreStage{display:block;}
  body.nochart #chartCard, body.nochart #panelWrap, body.nochart #cardsSec{display:none;}
  body.nochart #mainGrid{grid-template-columns:minmax(0,1fr);}
  /* equation strip */
  .eqstrip{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding:2px 4px 10px; margin-bottom:4px; border-bottom:1px dashed var(--rule);}
  .eqright{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .eqline{font-size:24px; font-weight:600; line-height:1.15; white-space:nowrap; word-spacing:2px;}
  .eqcap{font-size:11px; font-weight:800; color:var(--soft);}
  .eqbox{border:1.5px solid #e0e7ff; background:#f8f7ff; border-radius:14px; padding:8px 14px 10px; min-width:230px;}
  .eqbox-h{font-family:'Fredoka'; font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--line); margin-bottom:2px;}
  .eqbox-row{display:flex; justify-content:space-between; align-items:baseline; gap:18px; font-weight:800; font-size:14.5px;}
  .eqbox-row small{font-size:11.5px; opacity:.75;} .eqbox-row b{font-family:'Fredoka'; font-size:22px; font-weight:600; line-height:1.25;}
  .cm{color:#7c3aed;} .cb{color:#0891b2;}
  .slot{border-radius:10px; padding:0 4px; margin:0 -4px; transition:background .3s, box-shadow .3s;}
  .slot.glow-m{background:#ede9fe; box-shadow:0 0 0 3px #c4b5fd;} .slot.glow-b{background:#cffafe; box-shadow:0 0 0 3px #67e8f9;}
  .flynum{position:fixed; z-index:70; font-family:'Fredoka'; font-weight:600; pointer-events:none; transition:transform .8s cubic-bezier(.5,0,.2,1), opacity .2s ease .75s; transform-origin:0 0;}
  .xslot{display:inline-block; min-width:1.2em; text-align:center; border-radius:6px; padding:0 3px; transition:background .3s;} .xslot.working{color:var(--faint); font-size:.85em;} .xslot.popnum{animation:popv .35s cubic-bezier(.3,1.5,.6,1); background:#eef2ff;}
  /* inputs */
  .ansbox{display:inline-flex; align-items:center; gap:2px; border:2px solid var(--rule); border-radius:12px; padding:5px 10px; background:#fff; font-weight:800; font-size:16px; color:var(--soft);}
  .ansbox:focus-within{border-color:var(--line);}
  .ansbox input{width:72px; border:0; outline:0; font:inherit; color:var(--ink); text-align:center; background:transparent;}
  .ansbox.shake{animation:shake .3s;}
  .plugrow{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; font-size:14.5px;}
  .ans{width:76px; flex:none; border:2px solid var(--rule); border-radius:10px; padding:5px 8px; font:inherit; text-align:center; background:#fff;}
  .ans:focus{outline:0; border-color:var(--line);} .ans.ok{border-color:#16a34a; background:#dcfce7; color:#166534;} .ans.bad{border-color:var(--hi); animation:shake .3s;}
  /* table */
  .dtab{table-layout:fixed; min-width:600px;} .dtab th,.dtab td{padding:9px 10px; text-align:right; border-bottom:1px dashed var(--rule); white-space:nowrap;} .dtab th{font-weight:800;} .dtab .tl{text-align:left;}
  .dtab .avg td{border-top:2px solid var(--rule); border-bottom:0;} .dtab .hl{background:#faf9ff;}
  .cell{opacity:0; display:inline-block; transition:opacity .25s;} .cell.on{opacity:1;}
  .cell.formula{color:var(--faint); font-size:13px; font-weight:800;}
  .cell.res{animation:popv .32s cubic-bezier(.3,1.5,.6,1);} @keyframes popv{0%{transform:scale(.5); opacity:0} 100%{transform:scale(1); opacity:1}}
  .dtab tr.calcrow td{background:#f6f5ff;} .dtab tr.calcrow td.hl{background:#eeeaff;}
  .dtab .src{box-shadow:inset 0 0 0 2px #a5b4fc; border-radius:8px; transition:box-shadow .2s;} .dtab td{transition:background .25s;}
  .avgv{font-family:'Fredoka'; font-weight:600; font-size:24px; opacity:0; transition:opacity .4s;} .avgv.on{opacity:1;}
  .rsl{display:inline-block; min-width:22px; border-radius:99px; padding:1px 8px; font-size:13px; text-align:center;} .rsl.y{background:#dcfce7; color:#166534;} .rsl.n{background:#ffedd5; color:#9a3412;}
  .mathbox{background:#f6f5ff; border:1px solid #e0e7ff; border-radius:12px; padding:10px 12px; font-weight:700; font-size:14px; line-height:1.6;}
  /* score stage */
  .ohouse{display:grid; grid-template-columns:minmax(0,1fr); gap:20px 32px; align-items:center;} .ohouse>*{min-width:0;} @media (min-width:900px){ .ohouse{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);} }
  .ohouse-pic{border-radius:20px; background:linear-gradient(180deg,#eef2ff,#fff7ed); padding:18px 18px 6px;} .ohouse-pic .hsvg{width:100%; height:auto; max-height:320px;}
  .stat{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px dashed var(--rule); font-weight:700; color:var(--soft); font-size:15px;}
  .stat b{font-size:24px; font-weight:800; white-space:nowrap;}
  .hdots{display:flex; gap:6px;} .hdots i{width:26px; height:6px; border-radius:3px; background:#e7dccb;} .hdots i.on{background:var(--line);} .hdots i.cur{background:#a5b4fc;}
  .sqrow{display:grid; grid-template-columns:48px 1fr auto auto; gap:6px 14px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--rule); font-weight:700;}
  .sqrow .hsvg{width:48px; height:34px;}
  .sstep{border-top:1px solid var(--rule); padding-top:14px; margin-top:16px;}
  .slabel{font-size:12px; font-weight:800; color:var(--soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .namebox{margin-top:16px; border-radius:16px; padding:16px 18px; background:#f6f5ff; border:1px solid #e0e7ff;}
  /* flashcards */
  .flash{border:1.5px solid var(--rule); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; background:linear-gradient(180deg,#f6f5ff,#fff 60%);}
  .flash-house{width:56%; margin:0 auto;} .flash-house .hsvg{width:100%; height:auto;}
  .flash-val{font-size:38px; font-weight:800; color:var(--line); line-height:1.1;}
  .flash-ends{display:flex; justify-content:space-between; font-size:11.5px; font-weight:800; padding:0 42px;} .flash-ends .n{color:#c2410c;} .flash-ends .y{color:#15803d;}
  .mini{border:1.5px solid var(--rule); background:#fff; border-radius:10px; width:34px; height:30px; font-weight:800; cursor:pointer;}
  .mini:hover{border-color:var(--line); color:var(--line);}
  .storyico{flex:none; width:52px;} .storyico .hsvg{height:38px;}
  .storyend{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-radius:12px; padding:8px 12px; background:#f0fdf4; border:1px solid #bbf7d0;}
  .verdict{display:inline-block; border-radius:99px; padding:3px 12px; font-weight:800; font-size:13.5px;} .verdict.yes{background:#dcfce7; color:#166534;} .verdict.no{background:#ffedd5; color:#9a3412;}
  /* calculator */
  body.nocalc .calc-fab, body.nocalc .calc{display:none;}
  .calc-fab{position:fixed; right:18px; bottom:18px; z-index:60; width:52px; height:52px; border-radius:16px; background:var(--line); color:#fff; display:grid; place-items:center; border:0; cursor:pointer; box-shadow:0 10px 24px -10px rgba(79,70,229,.8);}
  .calc-fab:hover{filter:brightness(1.08);}
  .calc{position:fixed; right:18px; bottom:80px; z-index:60; width:236px; background:#fff; border:1px solid var(--rule); border-radius:18px; padding:12px; box-shadow:0 20px 40px -18px rgba(30,36,51,.45); display:none;}
  .calc.open{display:block;}
  .calc-disp{background:#f6f5ff; border-radius:12px; padding:8px 12px; text-align:right; min-height:58px;}
  .calc-expr{font-size:12.5px; color:var(--faint); font-weight:700; min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .calc-val{font-size:24px; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  .calc-keys{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px;}
  .calc-keys button{height:40px; border-radius:10px; border:1px solid var(--rule); background:#fff; font-weight:800; font-size:16px; cursor:pointer; color:var(--ink);}
  .calc-keys button:hover{background:#f6f5ff;} .calc-keys button.op{color:var(--line); background:#f6f5ff;} .calc-keys button.op:hover{background:#e0e7ff;} .calc-keys button.eq{background:var(--line); color:#fff; border-color:var(--line);} .calc-keys button.eq:hover{background:#4338ca;}
  .calc-use{margin-top:8px; width:100%;}
</style>
</head>
<body>
<div class="max-w-[1320px] mx-auto px-4 lg:px-6 py-4 lg:py-5 flex flex-col gap-4">

  <header class="flex flex-col gap-3">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#4f46e5"/><path d="M7 24 C 13 24, 14 10, 17 10 S 22 10, 27 10" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="9" cy="24" r="2.2" fill="#fdba74"/><circle cx="26" cy="10" r="2.2" fill="#86efac"/></svg>
        <div class="min-w-0">
          <h1 class="text-[18px] sm:text-[20px] lg:text-[22px] font-semibold leading-tight whitespace-nowrap">The Bidding War Story</h1>
          <div class="text-[13px] font-bold text-[color:var(--soft)] truncate">How a machine learns to say yes or no</div>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0"><a href="../general/index.html" class="chip" style="text-decoration:none">&larr; <span class="hidden sm:inline">All lessons</span><span class="sm:hidden">Lessons</span></a><div class="chip tabnum" id="chapChip">Chapter 1 of 5</div></div>
    </div>
    <nav class="prog" id="prog" aria-label="Chapters"></nav>
  </header>

  <main id="mainGrid" class="grid gap-4 lg:grid-cols-[minmax(0,1.55fr)_minmax(0,1fr)] items-start">
    <section class="flex flex-col gap-3 min-w-0">
      <div id="flashStage"></div>
      <div class="card-w p-3 lg:p-4" id="chartCard">
        <div id="partBar" class="partbar ptitle"></div>
        <div id="eqBar"></div>
        <svg id="chart" role="img" aria-label="Chance of selling above asking against open house visitors"></svg>
        <div id="c1Bar" class="c1bar"></div>
      </div>
      <div class="card-w p-5 lg:p-6" id="scoreStage"></div>
    </section>

    <aside class="card-w p-4 lg:p-5 flex flex-col gap-4 min-w-0 lg:min-h-[520px]" id="panelWrap">
      <div id="panel" class="flex flex-col gap-4 flex-1"></div>
      <div class="navrow">
        <button class="btn btn-ghost btn-sm" id="backBtn">&larr; Back</button>
        <div class="hintline" id="hintline"></div>
        <button class="btn btn-sm btn-main" id="nextBtn">Next &rarr;</button>
      </div>
    </aside>
    <section id="cardsSec">
      <div class="cardshead flex items-baseline justify-between mb-2 gap-x-2 flex-wrap">
        <h2 class="text-[17px] font-semibold" id="cardsTitle">The open houses</h2>
        <div class="text-[12.5px] font-bold text-[color:var(--faint)]" id="cardsHint"></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>
</div>

<button class="calc-fab" id="calcFab" aria-label="Open calculator" title="Calculator"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="3.5" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg></button>
<div class="calc" id="calc" role="dialog" aria-label="Calculator">
  <div class="flex items-center justify-between mb-2"><span class="text-[13px] font-extrabold text-[color:var(--soft)]">Calculator</span><button class="mini" id="calcClose" aria-label="Close calculator">&times;</button></div>
  <div class="calc-disp"><div class="calc-expr" id="calcExpr"></div><div class="calc-val tabnum" id="calcVal">0</div></div>
  <div class="calc-keys" id="calcKeys"></div>
  <button class="btn btn-main btn-sm calc-use" id="calcUse" style="display:none">Use this answer</button>
</div>
<script>
/* ---------- data + plain math ---------- */
// v: open house visitors, y: did it really sell above asking? (1 = yes), s: only sets how big the drawing is
const HOUSES=[
  {v:4,  y:0, s:900,  body:'#f6bd60', roof:'#c2703d'},
  {v:14, y:0, s:1200, body:'#f5cac3', roof:'#b5656b'},
  {v:19, y:1, s:1800, body:'#9ec5e8', roof:'#4a6f99'},
  {v:23, y:0, s:2200, body:'#e9d8a6', roof:'#9b7b3a'},
  {v:35, y:1, s:2800, body:'#bfe3d0', roof:'#3f8a6b'}
];
const NEWHOUSE={s:2000, body:'#c4b5fd', roof:'#6d28d9'};
const N=HOUSES.length, VMAX=50, FLASH=[0,4]; // flashcards: the quietest and the busiest house
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mean=a=>a.reduce((t,v)=>t+v,0)/a.length;
const sig=z=>1/(1+Math.exp(-z)), logit=p=>Math.log(p/(1-p));
// each variable gets its own step size: V1 is multiplied by up to 35 visitors (touchy), V2 by nothing (sluggish)
const STEP={m:0.01, b:3};
const Xof=v=>v;                                            // X is simply the number of visitors
const chance=(C,v)=>sig(C.m*Xof(v)+C.b);                   // the curve: chance = S(m × X + b)
const fromGuesses=(q,b)=>{ const x1=Xof(HOUSES[0].v), x2=Xof(HOUSES[4].v), l1=logit(q/100), l2=logit(b/100), m=(l2-l1)/(x2-x1); return {m, b:l1-m*x1}; };
const r2=x=>{ const v=Math.sign(x)*Math.round(Math.abs(x)*100+1e-9)/100; return v===0?0:v; };  // halves round away from zero, like by hand
const n2=x=>(r2(x)<0?'−':'')+Math.abs(r2(x)).toFixed(2);
const sg2=x=>r2(x)>0?'+'+n2(x):n2(x);
const par=x=>r2(x)<0?`(${n2(x)})`:n2(x);
const pct=p=>Math.round(p*100)+'%';
const p2=(C,i)=>r2(chance(C,HOUSES[i].v));                 // the chance as a 2-decimal number, like the learner sees it
const missOf=(C,i)=>r2(p2(C,i)-HOUSES[i].y);               // + means the curve was too keen
const avgMiss=C=>mean(HOUSES.map(h=>Math.abs(chance(C,h.v)-h.y)));
const nudge=(C,k=1)=>{ let gm=0,gb=0; HOUSES.forEach(h=>{ const x=Xof(h.v), e=chance(C,h.v)-h.y; gm+=e*x; gb+=e; }); return {m:C.m-k*STEP.m*gm/N, b:C.b-k*STEP.b*gb/N}; };  // k scales both step sizes
// the best curve, found exactly with Newton's method (plain nudging takes ~15,000 steps with raw visitors)
const BEST=(()=>{ let m=0,b=0; for(let k=0;k<50;k++){ let gm=0,gb=0,hmm=0,hmb=0,hbb=0;
  HOUSES.forEach(h=>{ const x=h.v, p=sig(m*x+b), e=p-h.y, w=p*(1-p); gm+=e*x; gb+=e; hmm+=w*x*x; hmb+=w*x; hbb+=w; });
  const det=hmm*hbb-hmb*hmb; m-=(hbb*gm-hmb*gb)/det; b-=(hmm*gb-hmb*gm)/det; } return {m,b}; })();
const BESTMISS=avgMiss(BEST);
const LEARNED={m:r2(BEST.m), b:r2(BEST.b)};
const parseNum=s=>parseFloat(String(s).replace(/[−–]/g,'-').replace(/[^0-9.\-]/g,''));
// the numbers behind one nudge, rounded so the on-screen arithmetic adds up
function gdData(C){ const m0=r2(C.m), b0=r2(C.b);
  const rows=HOUSES.map((h,i)=>{ const p=p2(C,i), e=r2(p-h.y), x=r2(Xof(h.v)), ex=r2(e*x); return {i,p,y:h.y,e,x,ex}; });
  const ae=r2(mean(rows.map(r=>r.e))), aex=r2(mean(rows.map(r=>r.ex)));
  return {rows,ae,aex,m0,b0,nm:r2(m0-STEP.m*aex),nb:r2(b0-STEP.b*ae)}; }
const gdTarget=C=>{ const D=gdData(C); return {m:D.nm,b:D.nb}; };
// which way: the average miss (b) and the miss weighted by X (m)
function wayData(C){ const D=gdData(C); return {g0:mean(D.rows.map(r=>r.e)), g1:mean(D.rows.map(r=>r.e*r.x))}; }
const wayTarget=C=>{ for(let k=0;k<3;k++) C=nudge(C); return C; };  // a preview of where a few nudges take the curve
const qRight=(q,C)=>{ const W=wayData(C); return q===0?(W.g0>0?'high':'low'):(W.g1>0?'high':'low'); };
const SMALL=.01;
const f4=x=>{ const v=Math.round(x*10000)/10000; return (v<0?'−':'')+String(Math.abs(v)); };  // up to 4 decimals, for α × average
const PN={m:'V1',b:'V2'};  // what the learner sees for the two parameters

/* ---------- five chapters: the eight screens are grouped into predict, assess, learn, iterate, use ---------- */
const CH5=[{t:'Predict',s:'Predict',steps:[0]},{t:'Assess predictions',s:'Assess',steps:[1,2]},{t:'Learn',s:'Learn',steps:[3,4]},{t:'Iterate',s:'Iterate',steps:[5,6]},{t:'Use the model',s:'Use',steps:[7]}];
// screen (and its sub-part) -> [chapter, part, parts in chapter]; 0 parts means a one-part chapter
const PARTS={'0':[1,0,0],'1':[2,1,3],'2.1':[2,2,3],'2.2':[2,3,3],'3.1':[3,1,3],'3.2':[3,2,3],'4':[3,3,3],'5':[4,1,2],'6':[4,2,2],'7':[5,0,0]};
const chapOf=step=>CH5.findIndex(c=>c.steps.includes(step));
function eyebrow(step,sub){ const [c,p,n]=PARTS[sub?`${step}.${sub}`:step]||PARTS[step]||PARTS[`${step}.1`]; return `Chapter ${c} &middot; ${CH5[c-1].t}${n?` &middot; Part ${p} of ${n}`:''}`; }

/* ---------- state ---------- */
const CH=[
  {t:'Your first curve', s:'First curve'},
  {t:'The results come in', s:'Results'},
  {t:'How wrong is my curve?', s:'How wrong?'},
  {t:'How much to change?', s:'Change?'},
  {t:'Fixing the curve', s:'Fixing'},
  {t:'Repeat the steps', s:'Repeat'},
  {t:'Simulate', s:'Simulate'},
  {t:'A new listing', s:'New listing'}
];
const Z=()=>[0,0,0,0,0];
const freshVis=()=>({pred:Z(),res:Z(),miss:Z(),cPred:Z(),cRes:Z(),cMiss:Z()});
const freshC1=()=>({i:0,g:[null,null],val:[null,null],gLanded:0,line:false,lineAnim:false,placed:0,flying:false,landed:-1,rule:false,ruleAnim:false,called:0,calling:false});
const freshC2=()=>({flying:false,revealed:Z(),landed:-1});
const freshSc=()=>({part:1,i:0,done:Z(),stage:0,val:'',tries:0,hint:'',msg:''});
const freshF=(key='')=>({key,step:0,part:1,q:[null,null],tab:false,calcBusy:false});
const freshP=(key='')=>({key,val:{m:'',b:''},done:{m:false,b:false},tries:{m:0,b:0},fb:{m:'',b:''},pushed:false,busy:false,msg:''});
const freshIt=(key='')=>({key,L:null,step:2,phase:'',D:null,demoDone:false,tok:0,vis:freshVis(),pop:null,cardL:null,
  alpha:1,n:100,simL:null,steps:0,trail:[],hist:[],simBusy:false,simDone:false,bounce:false});
const fresh=()=>({ch:0,maxCh:0,first:fromGuesses(15,85),c1:freshC1(),c2:freshC2(),sc:freshSc(),f:freshF(),p:freshP(),it:freshIt(),fix:null,
  newV:28,n8:0,n8v:'',n8tries:0,n8hint:'',n8x:false});
let S=fresh();
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
function anim(dur,fn){ return new Promise(res=>{ const t0=performance.now(); const st=t=>{ const k=clamp((t-t0)/dur,0,1), e=1-Math.pow(1-k,3); fn(e); if(k<1) requestAnimationFrame(st); else res(); }; requestAnimationFrame(st); }); }

/* ---------- houses ---------- */
function houseSVG(h,attrs='class="hsvg"'){
  const f=clamp((h.s-700)/2900,0,1);
  const bw=34+f*36, bh=21+f*12, x0=50-bw/2, yb=62, peak=yb-bh-13-f*6;
  let w=''; const k=2+Math.round(f*2);
  for(let j=0;j<k;j++){ const cx=x0+bw*(j+.5)/k; if(Math.abs(cx-50)<7) continue; w+=`<rect x="${cx-3.5}" y="${yb-bh+5}" width="7" height="6.5" rx="1" fill="#fff" stroke="#1e2433" stroke-opacity=".25"/>`; }
  return `<svg ${attrs} viewBox="0 0 100 70" aria-hidden="true"><ellipse cx="50" cy="63" rx="48" ry="3.5" fill="#e9e2d4"/>
  <rect x="${x0}" y="${yb-bh}" width="${bw}" height="${bh}" fill="${h.body}" stroke="#1e2433" stroke-opacity=".2"/>
  <polygon points="${x0-4},${yb-bh+1} 50,${peak} ${x0+bw+4},${yb-bh+1}" fill="${h.roof}"/>
  <rect x="46.5" y="${yb-12}" width="7" height="12" rx="1" fill="#7c4a2d"/>${w}</svg>`;
}

/* ---------- chart ---------- */
const svg=$('chart');
const artW=()=>NARROW?40:70;
let W=640,H=400,NARROW=false; const M={l:66,r:16,t:30,b:44};
const X=v=>M.l+v/VMAX*(W-M.l-M.r);
const Y=p=>M.t+(1-p)*(H-M.t-M.b);
function curvePath(C){ let d=''; for(let k=0;k<=120;k++){ const v=k*VMAX/120; d+=(k?'L':'M')+X(v).toFixed(1)+' '+Y(chance(C,v)).toFixed(1)+' '; } return d; }
const curveEl=(C,color,w,extra='')=>`<path d="${curvePath(C)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const callColor=p=>p>=.5?'var(--yes)':'var(--no)';
const missCol=e=>e>0?'var(--hi)':'var(--lo)', missTxt=e=>e>0?'#9f1239':'#92400e';

function chartOpts(){
  const c=S.ch, all=[1,1,1,1,1];
  if(c===0){ const C=S.c1; return {main:C.line?S.first:null, c1:true, rule:C.rule}; }
  if(c===1) return {main:S.first, c2:true, rule:true};
  if(c===3){ const F=S.f, both=F.q.every(v=>v&&!v.startsWith('wrong')); return {main:S.fix, rings:all, dots:all, miss:all, ghostL:both?wayTarget(S.fix):null, arrows:true}; }
  if(c===4){ const moved=S.p.busy||S.p.pushed; return {main:S.fix, rings:all, dots:all, miss:all, start:moved?S.first:null, legend:moved}; }
  if(c===5){ const V=S.it.vis; return {main:S.it.L||S.first, rings:V.res, dots:V.pred, miss:V.miss, start:S.first, legend:true}; }
  if(c===6) return {main:simL(), rings:all, dots:all, miss:all, trail:S.it.trail, start:S.first, legend:true};
  return {main:LEARNED, rule:true, newHouse:true};
}
// a house drawn on the chart at its chance (above the dot, or below it when it sits near the top)
function houseAt(i,p,label,kind,pop,dot){
  const h=HOUSES[i], x=X(h.v), y=Y(p), aw=artW(), ah=aw*.7, up=y-ah-34>-M.t+4;
  const ay=up?y-ah-6:y+8, ty=up?ay-8:ay+ah+16;
  const tag=kind==='guess'
    ? `<rect x="${x-25}" y="${ty-15.5}" width="50" height="22" rx="8" fill="var(--line)"/><text x="${x}" y="${ty}" font-size="13" text-anchor="middle" fill="#fff" font-weight="800">${label}</text>`
    : `<text class="halo" x="${x}" y="${ty}" font-size="13" text-anchor="middle" fill="var(--line)" font-weight="800">${label}</text>`;
  const ring=kind==='guess'&&!dot;
  return `<g class="${pop?'popin':''}" style="transform-origin:${x}px ${y}px">${houseSVG(h,`x="${x-aw/2}" y="${ay}" width="${aw}" height="${ah}"`)}
    <circle class="${pop==='ping'?'ping':''}" cx="${x}" cy="${y}" r="${ring?6.5:6.5}" fill="${dot||(ring?'#fff':'var(--line)')}" stroke="${ring?'var(--line)':'#fff'}" stroke-width="${ring?3:2}"/>${tag}</g>`;
}
function ringAt(i,pop){ const h=HOUSES[i], x=X(h.v), y=Y(h.y);
  return `<circle class="${pop?'popin':''}" style="transform-origin:${x}px ${y}px" cx="${x}" cy="${y}" r="8.5" fill="#fff" stroke="${h.y?'var(--yes)':'var(--no)'}" stroke-width="3.5"/>`; }
function arrowAt(x,y,dir){ const room=dir>0?y-Y(1):Y(0)-y, len=clamp(room-2,24,44), y2=y-dir*len, col="#16a34a";
  return `<g class="blink"><line x1="${x}" y1="${y}" x2="${x}" y2="${y2+dir*10}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><path d="M${x-9} ${y2+dir*12} L${x+9} ${y2+dir*12} L${x} ${y2} Z" fill="${col}"/></g>`; }

const missSeen=new Set(); // miss bars already drawn, so they animate only the first time they appear
function renderChart(){
  const cw=svg.clientWidth||640; W=Math.max(300,cw); const wide=['wide','c5','c6'].some(c=>document.body.classList.contains(c));
  H=Math.round(wide?clamp(W*0.5,320,520):clamp(W*0.62,300,440));
  NARROW=W<520; M.l=NARROW?44:66;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  const o=chartOpts(); let s='';
  [0,.25,.5,.75,1].forEach(p=>{ if(NARROW&&(p===.25||p===.75)) return;
    const plain=o.c1||o.newHouse, edge=plain?'stroke="#efe9df"':p===1?'stroke="#16a34a" stroke-width="2" opacity=".6"':p===0?'stroke="#e11d48" stroke-width="2" opacity=".6"':'stroke="#efe9df"';
    s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${Y(p)}" y2="${Y(p)}" ${edge}/><text x="${M.l-8}" y="${Y(p)+4}" font-size="11.5" text-anchor="end" fill="#9aa3b2" font-weight="700">${p*100}%</text>`; });
  for(let v=0;v<=VMAX;v+=10) s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${H-M.b}" stroke="#f4efe6"/><text x="${X(v)}" y="${H-M.b+17}" font-size="11.5" text-anchor="middle" fill="#9aa3b2" font-weight="700">${v}</text>`;
  s+=`<text x="${(M.l+W-M.r)/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="#5b6476" font-weight="800">Open house visitors</text>`;
  if(!NARROW) s+=`<text transform="translate(13 ${(Y(0)+Y(1))/2}) rotate(-90)" font-size="12" text-anchor="middle" fill="#5b6476" font-weight="800">Chance it sells above asking</text>`;
  // the rule: above 50% means YES
  if(o.rule&&(!o.c1||S.c1.rule)){ const y=Y(.5), px=W-M.r-(NARROW?84:100);
    s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 5" opacity=".75"/>`;
    s+=`<g class="${o.c1&&S.c1.ruleAnim?'popin':''}" style="transform-origin:${px+40}px ${y}px"><rect x="${px}" y="${y-12}" width="${NARROW?80:96}" height="24" rx="12" fill="var(--line)"/><text x="${px+(NARROW?40:48)}" y="${y+4.5}" font-size="${NARROW?11:12.5}" text-anchor="middle" fill="#fff" font-weight="800">50% rule</text>
      <text class="halo" x="${px+(NARROW?40:48)}" y="${y-19}" font-size="12" text-anchor="middle" fill="#166534" font-weight="800">&#9650; YES</text><text class="halo" x="${px+(NARROW?40:48)}" y="${y+30}" font-size="12" text-anchor="middle" fill="#9a3412" font-weight="800">&#9660; NO</text></g>`; }
  if(o.trail) o.trail.slice(-25).forEach((C,j,arr)=>{ s+=curveEl(C,'var(--line)',2,`opacity="${0.06+0.3*(j+1)/arr.length}"`); });
  if(o.start) s+=curveEl(o.start,'#9aa3b2',2.5,'stroke-dasharray="6 6"');
  if(o.ghostL) s+=curveEl(o.ghostL,'#16a34a',3,'opacity=".55" stroke-dasharray="6 6" class="blink"');
  if(o.main) s+=curveEl(o.main,'var(--line)',4.5,o.c1&&S.c1.lineAnim?'class="drawline slow" pathLength="1"':'');
  // misses: a bar from the curve's chance to what really happened
  if(!o.miss) missSeen.clear();
  if(o.miss) HOUSES.forEach((h,i)=>{ if(!o.miss[i]) return; const p=chance(o.main,h.v), e=p-h.y, x=X(h.v), fresh=!missSeen.has(i), dl=`animation-delay:${(i*.18).toFixed(2)}s; animation-fill-mode:both`; missSeen.add(i);
    s+=`<line ${fresh?`class="drawline" pathLength="1" style="${dl}"`:''} x1="${x}" x2="${x}" y1="${Y(p)}" y2="${Y(h.y)}" stroke="${missCol(e)}" stroke-width="3.5" stroke-linecap="round"/>`;
    if(!NARROW&&Math.abs(Y(p)-Y(h.y))>22){ const my=(Y(p)+Y(h.y))/2; s+=`<text class="halo ${fresh?'fadein':''}" ${fresh?`style="animation-delay:${(i*.18+.6).toFixed(2)}s"`:''} x="${x-9}" y="${my+4}" font-size="12" text-anchor="end" fill="${missTxt(e)}" font-weight="800">${n2(Math.abs(e))}</text>`; } });
  if(o.rings) HOUSES.forEach((h,i)=>{ if(o.rings[i]) s+=ringAt(i,S.ch===5&&S.it.pop&&S.it.pop.t==='res'&&S.it.pop.i===i); });
  if(o.dots) HOUSES.forEach((h,i)=>{ if(!o.dots[i]) return; const p=chance(o.main,h.v), x=X(h.v), y=Y(p), pop=S.ch===5&&S.it.pop&&S.it.pop.t==='pred'&&S.it.pop.i===i;
    s+=`<g class="${pop?'popin':''}" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="6.5" fill="${callColor(p)}" stroke="#fff" stroke-width="2"/>${NARROW?'':`<text class="halo" x="${x+10}" y="${y+4.5}" font-size="12.5" fill="var(--line)" font-weight="800">${pct(p)}</text>`}</g>`; });
  if(o.arrows&&S.f.part===1){ const F=S.f, Wd=wayData(S.fix), ok=q=>F.q[q]&&!F.q[q].startsWith('wrong');
    if(ok(0)&&Math.abs(Wd.g0)>=SMALL){ const v=27; s+=arrowAt(X(v),Y(chance(S.fix,v)),Wd.g0>0?-1:1); }
    if(ok(1)&&Math.abs(Wd.g1)>=SMALL) [9,40].forEach(v=>{ const dd=-Wd.g1*Xof(v); s+=arrowAt(X(v),Y(chance(S.fix,v)),dd>0?1:-1); }); }
  // chapter 1: your two guesses, then the houses your curve gave a chance, then the calls
  if(o.c1){ const C=S.c1, calledCol=i=>i<C.called?callColor(chance(S.first,HOUSES[i].v)):null;
    FLASH.forEach((hi,k)=>{ if(C.g[k]==null||k>=C.gLanded) return; s+=houseAt(hi,C.g[k]/100,C.g[k]+'%','guess',hi===C.landed?(C.calling?'ping':true):false,calledCol(hi)); });
    if(C.line) [1,2,3].slice(0,C.placed).forEach(hi=>{ const p=chance(S.first,HOUSES[hi].v); s+=houseAt(hi,p,pct(p),'curve',hi===C.landed?(C.calling?'ping':true):false,calledCol(hi)); }); }
  // chapter 2: houses on the curve until their result lands, then just the dot and the ring
  if(o.c2){ const D=S.c2; HOUSES.forEach((h,i)=>{ const p=chance(S.first,h.v), x=X(h.v), y=Y(p);
    if(!D.revealed[i]){ s+=houseAt(i,p,pct(p),'curve',false,callColor(p)); return; }
    const below=h.y===1; // put the label on the side away from the ring
    s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="${callColor(p)}" stroke="#fff" stroke-width="2"/>${NARROW?'':`<text class="halo" x="${x+10}" y="${y+(below?18:-8)}" font-size="12.5" fill="var(--line)" font-weight="800">${pct(p)}</text>`}`;
    s+=ringAt(i,i===D.landed); }); }
  if(o.c2||o.rings&&o.rings.some(Boolean)) s+=`<text class="halo" x="${M.l+8}" y="${Y(1)-12}" font-size="12" font-weight="800" fill="#166534">Sold above asking = 1</text><text class="halo" x="${W-M.r}" y="${Y(0)-12}" text-anchor="end" font-size="12" font-weight="800" fill="#be123c">Did not = 0</text>`;
  if(o.newHouse){ const v=S.newV, p=chance(LEARNED,v), x=X(v), y=Y(p);
    s+=`<line x1="${x}" x2="${x}" y1="${Y(0)}" y2="${y}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`;
    if(S.n8<2) s+=`<g class="blink"><circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="${x+20}" cy="${y-20}" r="12" fill="#1e2433"/><text x="${x+20}" y="${y-15}" font-size="14" text-anchor="middle" fill="#fff" font-weight="800">?</text></g>`;
    else { const aw=NARROW?40:60; s+=`<g>${houseSVG(NEWHOUSE,`x="${x-aw/2}" y="${y-aw*.7-8}" width="${aw}" height="${aw*.7}"`)}<circle cx="${x}" cy="${y}" r="8" fill="${callColor(p)}" stroke="#fff" stroke-width="2.5"/><text class="halo" x="${x+13}" y="${y+18}" font-size="15" font-weight="800" fill="${p>=.5?'#166534':'#9a3412'}">${pct(p)} &middot; ${p>=.5?'YES':'NO'}</text></g>`; } }
  if(o.legend){ const n=NARROW, lx=M.l+(n?6:12), ly=M.t+(n?14:18), fs=n?10.5:12, sw=n?16:24, gap=n?96:112;
    s+=`<g><rect x="${lx}" y="${ly}" width="${n?184:240}" height="${n?24:28}" rx="8" fill="#fff" stroke="#ebe4d8"/>
      <line x1="${lx+10}" x2="${lx+10+sw}" y1="${ly+(n?12:14)}" y2="${ly+(n?12:14)}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><text x="${lx+16+sw}" y="${ly+(n?16:18.5)}" font-size="${fs}" font-weight="800" fill="#5b6476">Curve now</text>
      <line x1="${lx+gap}" x2="${lx+gap+sw}" y1="${ly+(n?12:14)}" y2="${ly+(n?12:14)}" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="5 5"/><text x="${lx+gap+sw+6}" y="${ly+(n?16:18.5)}" font-size="${fs}" font-weight="800" fill="#5b6476">First curve</text></g>`; }
  svg.innerHTML=s;
}
// screen position of a point on the chart
function chartPt(v,p){ const pt=svg.createSVGPoint(); pt.x=X(v); pt.y=Y(p); return pt.matrixTransform(svg.getScreenCTM()); }

/* ---------- equation strip ---------- */
function renderEq(C=S.fix,title='Your curve',blank=false){ const q='?';

function missFoot(e,id=''){ const ae=Math.abs(e), cls=ae<.15?'ok':e>0?'hi':'lo'; return `<div class="miss ${cls}" ${id?`id="${id}"`:''}>miss ${n2(ae)} &middot; ${ae<.15?'close':e>0?'too high':'too low'}</div>`; }

  if(c===0){ const C=S.c1;
    return HOUSES.map((h,i)=>{ const k=FLASH.indexOf(i), known=k>=0?C.g[k]!=null&&k<C.gLanded:C.line&&i<=C.placed, p=k>=0?C.g[k]/100:chance(S.first,h.v);
      const foot=i<C.called?`<div class="miss ${p>=.5?'yes':'no'} ${i===C.landed?'popin':''}">Says ${p>=.5?'YES':'NO'}</div>`:'';
      return card(i,row(k>=0?'Your guess':'Curve says',known?pct(p):QM,'g'),foot); }).join(''); }
  if(c===1){ const D=S.c2;
    return HOUSES.map((h,i)=>{ const p=chance(S.first,h.v), call=p>=.5?1:0, rev=D.revealed[i];
      const foot=`<div class="miss ${rev?(call===h.y?'ok':'hi'):(call?'yes':'no')}">Said ${call?'YES':'NO'}${rev?(call===h.y?' &middot; right ✓':' &middot; wrong ✗'):''}</div>`;
      return card(i,row('Curve says',pct(p),'g')+row('Result',rev?resTxt(h.y):QM,h.y?'ry':'rn','rRes'+i),foot); }).join(''); }
  if(c===5){ const I=S.it, V=I.vis, L=I.cardL||I.L||S.first;
    return HOUSES.map((h,i)=>{ const e=missOf(L,i);
      return card(i,row('Curve says',V.cPred[i]?n2(p2(L,i)):QM,'g','rLine'+i)+row('Result',V.cRes[i]?resTxt(h.y):QM,h.y?'ry':'rn','rRes'+i),
        V.cMiss[i]?missFoot(e,'rMiss'+i):`<div class="miss wait" id="rMiss${i}">miss: ?</div>`); }).join(''); }

  return HOUSES.map((h,i)=>card(i,row('Curve says',n2(p2(L,i)),'g')+row('Result',resTxt(h.y),h.y?'ry':'rn'),missFoot(missOf(L,i)))).join('');
}

/* ---------- flying things ---------- */
function flyNum(fromEl,toEl,text,color){ return new Promise(res=>{ if(!fromEl||!toEl){ res(); return; } const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const el=document.createElement('span'); el.className='flynum'; el.textContent=text; el.style.color=color;
  const fs=parseFloat(getComputedStyle(fromEl).fontSize), ts=parseFloat(getComputedStyle(toEl).fontSize);
  el.style.fontSize=fs+'px'; el.style.left=a.left+'px'; el.style.top=a.top+'px'; document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${ts/fs})`; el.style.opacity=0; }));
  setTimeout(()=>{ el.remove(); res(); },850); }); }
// a value flies from a point on the chart into an element (e.g. a card slot)
function flyFromChart(v,p,dx,toEl,text,color){ return new Promise(res=>{ if(!toEl){ res(); return; } const a=chartPt(v,p), b=toEl.getBoundingClientRect(), x=a.x+dx, y=a.y-10;
  const el=document.createElement('span'); el.className='flynum'; el.textContent=text; el.style.color=color; el.style.fontSize='15px';
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transform=`translate(${b.left-x}px,${b.top-y}px)`; el.style.opacity=0; }));
  setTimeout(()=>{ el.remove(); res(); },850); }); }
// a house flies from its card onto its spot on the chart
async function flyHouse(hi,p){
  const src=document.querySelector(`.hcard[data-i="${hi}"] .hsvg`); if(!src) return;
  const to=chartPt(HOUSES[hi].v,p), from=src.getBoundingClientRect(), ghost=src.cloneNode(true);
  Object.assign(ghost.style,{position:'fixed',left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`,zIndex:60,pointerEvents:'none',
    transition:'transform .9s cubic-bezier(.45,.05,.3,1)',transformOrigin:'center',filter:'drop-shadow(0 8px 10px rgba(30,36,51,.2))'});
  document.body.appendChild(ghost); src.style.opacity=.25;
  const k=svg.getScreenCTM().a, aw=artW()*k, ah=aw*.7, drawn=Math.min(from.width,from.height*100/70);
  const up=Y(p)-ah/k-34>-M.t+4, cy=up?to.y-6*k-ah/2:to.y+8*k+ah/2;
  try{ await sleep(30); ghost.style.transform=`translate(${to.x-(from.left+from.width/2)}px, ${cy-(from.top+from.height/2)}px) scale(${aw/drawn})`; await sleep(950); }
  finally{ ghost.remove(); src.style.opacity=''; }
}
// a result ring flies from the card's Result row to 100% or 0%
function flyRing(i){ return new Promise(res=>{ const src=$('rRes'+i); if(!src){ res(); return; } const a=src.getBoundingClientRect(), b=chartPt(HOUSES[i].v,HOUSES[i].y);
  const r=document.createElement('div'); r.className='flyr'; r.style.borderColor=HOUSES[i].y?'#16a34a':'#f97316'; r.style.left=(a.left+a.width/2-10)+'px'; r.style.top=(a.top+a.height/2-10)+'px'; document.body.appendChild(r);
  const an=r.animate([{transform:'translate(0,0) scale(.8)'},{transform:`translate(${b.x-(a.left+a.width/2)}px,${b.y-(a.top+a.height/2)}px) scale(1.1)`}],{duration:800,easing:'cubic-bezier(.55,.05,.25,1)',fill:'both'});
  an.onfinish=()=>{ r.remove(); res(); }; }); }

/* ---------- chapter 1: two flashcards, then your curve ---------- */

const alive1=C=>S.ch===0&&S.c1===C;
// your two guessed houses fly from their cards onto the chart, then the curve draws itself through them
async function startReveal(){
  const C=S.c1; C.gLanded=0; update();
  await sleep(450);
  for(let k=0;k<2;k++){ if(!alive1(C)) return;
    await flyHouse(FLASH[k],C.g[k]/100); if(!alive1(C)) return;
    C.gLanded=k+1; C.landed=FLASH[k]; update(); C.landed=-1; await sleep(300); }
  await sleep(300); if(!alive1(C)) return;
  S.first=fromGuesses(C.g[0],C.g[1]); C.line=true; C.lineAnim=true; C.placed=0; update(); C.lineAnim=false;
}
// the other three houses fly from their cards onto your curve
async function predictNext(){
  const C=S.c1; if(C.flying||!C.line) return; C.flying=true; update(); await sleep(250);
  for(const hi of [1,2,3]){ if(!alive1(C)) return;
    await flyHouse(hi,chance(S.first,HOUSES[hi].v)); if(!alive1(C)) return;
    C.placed=hi; C.landed=hi; update(); C.landed=-1; await sleep(300); }
  C.flying=false; update();
}
// the 50% rule turns each chance into a YES or a NO
async function makeCall(){
  const C=S.c1; if(C.calling) return; C.calling=true; C.rule=true; C.ruleAnim=true; update(); C.ruleAnim=false;
  await sleep(1100);
  for(let i=0;i<N;i++){ if(!alive1(C)) return; C.called=i+1; C.landed=i; update(); C.landed=-1; await sleep(650); }
  C.calling=false; update();
}
function renderC1Bar(){

/* ---------- chapter 2: the results come in ---------- */
function renderC2Bar(){

async function revealResults(){
  const D=S.c2; if(D.flying) return; D.flying=true; D.revealed=Z(); update(); await sleep(300);
  for(let i=0;i<N;i++){ if(S.ch!==1||S.c2!==D) return;
    const el=$('rRes'+i); if(el){ el.innerHTML=resTxt(HOUSES[i].y); el.closest('.hcard').classList.add('cur'); }
    await sleep(350); await flyRing(i); if(S.ch!==1||S.c2!==D) return;
    D.revealed[i]=1; D.landed=i; update(); D.landed=-1; await sleep(250); }

}

/* ---------- chapter 3: how wrong is my curve? ---------- */
function scMiss(i){ return Math.abs(missOf(S.first,i)); }
function renderScore(){
  const T=S.sc, ms=HOUSES.map((h,i)=>scMiss(i)), allDone=T.done.every(v=>v), part=allDone?T.part:1, sum=r2(ms.reduce((a,b)=>a+b,0)), avg=r2(sum/N);

    h+=`<div class="ohouse mt-4">

        <div class="stat"><span>Miss</span><b style="color:var(--faint)">?</b></div>
        <div class="mt-4 flex flex-col gap-2">
          ${T.msg?`<span class="text-[13px] font-extrabold" style="color:#166534">${T.msg}</span>`:''}
          <span class="text-[16px] font-bold"><b>How far off was your curve?</b> (the bigger number minus the smaller one)</span>
          ${T.hint?`<span class="text-[13px] font-bold" style="color:#9a3412">${T.hint}</span>`:''}
          <span class="flex items-center gap-2 flex-wrap"><label class="ansbox ${T.tries&&T.hint?'shake':''}"><input id="scIn" inputmode="decimal" autocomplete="off" value="${T.val}" aria-label="How far off, as a decimal"></label>

  } else {
    h+=`<div class="mt-4">${HOUSES.map((H,i)=>`<div class="sqrow">${houseSVG(H)}<span>${H.v} visitors</span><span class="text-[color:var(--soft)] tabnum">said ${n2(p2(S.first,i))}, result ${H.y}</span><span class="tabnum">miss <b>${n2(ms[i])}</b></span></div>`).join('')}</div>`;
    if(part===1) h+=`<div class="flex flex-wrap items-center justify-between gap-3 mt-4 pt-4 border-t border-[color:var(--rule)]">
        <span class="text-[15px] font-bold">${T.msg?`<span style="color:#166534">${T.msg}</span> `:''}All 5 misses measured.</span>

    else h+=`<div class="sstep"><div class="slabel">Average the misses</div>
        <div class="text-[16px] font-bold tabnum">(${ms.map(n2).join(' + ')}) ÷ 5 = <b style="color:var(--ink)">${n2(avg)}</b></div></div>

  if($('scNext')) $('scNext').onclick=()=>{ go(3); window.scrollTo({top:0,behavior:'smooth'}); };
}
function scCheck(){ const T=S.sc, i=T.i, m=scMiss(i), v=parseNum(T.val);
  if(isNaN(v)){ T.hint='Type a number.'; update(); $('scIn')?.focus({preventScroll:true}); return; }

  if(Math.abs(v)>1&&Math.abs(Math.abs(v)/100-m)<.006) return scAccept(false,true);
  T.tries++; const p=p2(S.first,i), y=HOUSES[i].y;
  T.hint=T.tries===1?`Not quite. ${pct(p)} as a decimal is ${n2(p)}. Take the bigger number minus the smaller one.`:`${n2(Math.max(p,y))} − ${n2(Math.min(p,y))} = ?`;
  update(); $('scIn')?.focus({preventScroll:true}); }
function scAccept(shown,asPct){ const T=S.sc, i=T.i, m=scMiss(i);

function plugCheck(k,shown){ const P5=S.p, D=gdData(S.first), target=k==='m'?D.nm:D.nb, old=k==='m'?D.m0:D.b0, avg=k==='m'?D.aex:D.ae;

function renderSimChart(){ const el=$('c7Chart'); if(!el) return; const I=S.it, w=280, h=74, n=I.hist.length;

async function runSim(){ const I=S.it, tok=++I.tok; I.simBusy=true; I.simDone=false; I.bounce=false; I.simL={...S.first}; I.steps=0; I.trail=[]; I.hist=[avgMiss(S.first)]; update();

  document.addEventListener('keydown',e=>{ if(!calc.classList.contains('open')||e.target.tagName==='INPUT') return;
    const map={'Enter':'eq','=':'eq','Backspace':'back','x':'*','X':'*'};
    if(e.key==='Escape'){ calc.classList.remove('open'); return; }
    const k=map[e.key]??(/^[0-9.+\-*/]$/.test(e.key)?e.key:undefined); if(k){ e.preventDefault(); press(k); } });
})();
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(update,80); });
go(0);
</script>
</body>
