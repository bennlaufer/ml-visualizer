<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtor Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
<style>
  :root{
    --bg:#fbf6ee; --card:#ffffff; --ink:#1e2433; --soft:#5b6476; --faint:#9aa3b2; --rule:#ebe4d8;
    --line:#4f46e5; --line-soft:#e0e7ff; --real:#1e2433; --hi:#e11d48; --hi-soft:#ffe4e9;
    --lo:#d97706; --lo-soft:#fff1d6; --best:#15803d; --best-soft:#dcfce7; --bot:#0d9488; --bot-soft:#ccfbf1;
    --accent:#f97316;
  }
  html,body{background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif;}
  body{overflow-x:hidden;}
  h1,h2,h3,.disp{font-family:'Fredoka','Nunito',sans-serif;}
  .card-w{background:var(--card); border:1px solid var(--rule); border-radius:18px; box-shadow:0 1px 0 rgba(30,36,51,.04),0 6px 20px -12px rgba(30,36,51,.18);}
  /* progress */
  .prog{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px;}
  .pstep{display:flex; flex-direction:column; gap:5px; align-items:flex-start; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:var(--faint); font-size:12px; font-weight:700; min-width:0;}
  .pstep:disabled{cursor:not-allowed;}
  .pbar{height:6px; width:100%; border-radius:99px; background:#e7dfd1; overflow:hidden;}
  .pbar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .4s;}
  .pstep.done .pbar i{width:100%;}
  .pstep.cur .pbar i{width:100%; background:var(--line);}
  .pstep.done{color:var(--soft);} .pstep.cur{color:var(--line);}
  .plabel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  /* mentor */
  .mentor{display:flex; gap:12px; align-items:flex-start;}
  .avatar{flex:0 0 auto; width:54px; height:54px;}
  .bubble{position:relative; background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:10px 14px; font-size:15.5px; line-height:1.45; font-weight:600; min-height:54px; display:flex; align-items:center; flex:1; box-shadow:0 6px 18px -14px rgba(30,36,51,.3);}
  .bubble::before{content:""; position:absolute; left:-8px; top:18px; width:14px; height:14px; background:var(--card); border-left:1px solid var(--rule); border-bottom:1px solid var(--rule); transform:rotate(45deg);}
  .bubble.pop{animation:pop .35s ease;}
  .bubble.bot{border-color:#99e6dc; background:#f2fdfb;} .bubble.bot::before{background:#f2fdfb; border-color:#99e6dc;}
  @keyframes pop{0%{transform:scale(.97); opacity:.4} 100%{transform:scale(1); opacity:1}}
  .who{font-family:'Fredoka'; font-size:12px; color:var(--soft); font-weight:600; margin-bottom:2px; display:block;}
  /* chart */
  #chart{width:100%; display:block; user-select:none; -webkit-user-select:none;}
  #chart text{font-family:'Nunito',sans-serif;}
  .grab{cursor:grab;} .grab:active{cursor:grabbing;}
  .grow{transform-box:fill-box; transform-origin:0 0; animation:grow .45s cubic-bezier(.3,1.4,.6,1);}
  @keyframes grow{from{transform:scale(0)} to{transform:scale(1)}}
  .fadein{animation:fadein .5s ease;}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  .sw{display:inline-block; width:18px; height:4px; border-radius:2px;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%;}
  /* house cards */
  .cards{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x mandatory;}
  .hcard{flex:0 0 158px; scroll-snap-align:start; background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; cursor:default; transition:transform .15s, box-shadow .15s, border-color .15s;}
  .hcard.tap{cursor:pointer;}
  .hcard.tap:hover{transform:translateY(-2px); border-color:#c7c2ff; box-shadow:0 8px 20px -14px rgba(79,70,229,.6);}
  @media (min-width:1024px){ .cards{display:grid; grid-template-columns:repeat(5,1fr); overflow:visible;} .hcard{flex:auto;} }
  .hsvg{width:100%; height:76px; display:block;}
  .hsize{font-family:'Fredoka'; font-weight:600; font-size:15px;}
  .hrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--soft); font-weight:700;}
  .hrow b{font-size:16px; color:var(--ink); font-weight:800;}
  .hrow b.g{color:var(--line);} .hrow b.r{color:var(--real);} .hrow b.bt{color:var(--bot);} .hrow b.bs{color:var(--best);}
  .miss{font-size:12.5px; font-weight:800; border-radius:10px; padding:4px 8px; margin-top:2px; line-height:1.35;}
  .miss.hi{background:var(--hi-soft); color:#9f1239;} .miss.lo{background:var(--lo-soft); color:#92400e;} .miss.ok{background:var(--best-soft); color:#166534;}
  .miss.sq{background:#fff7ed; color:#9a3412; border:1px dashed #fdba74;}
  .cbtn{margin-top:4px; font-size:12.5px; font-weight:800; border-radius:10px; padding:6px 8px; border:1.5px dashed #a5b4fc; background:#eef2ff; color:var(--line); cursor:pointer; width:100%;}
  .cbtn:hover{background:#e0e7ff;}
  .sold{transform-box:fill-box; transform-origin:50% 100%;}
  .sold.drop{animation:drop .7s cubic-bezier(.3,1.6,.5,1);}
  @keyframes drop{0%{transform:translateY(-30px) rotate(-12deg); opacity:0} 60%{opacity:1} 100%{transform:none}}
  /* panel */
  .ptitle{font-family:'Fredoka'; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--accent);}
  .phead{font-family:'Fredoka'; font-size:24px; font-weight:600; line-height:1.15;}
  .task{font-size:14.5px; color:var(--soft); font-weight:600;}
  .big{font-family:'Fredoka'; font-weight:600; font-size:34px; line-height:1;}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; padding:4px 10px; border-radius:99px; background:#f3efe7; color:var(--soft);}
  .choice{border:2px solid var(--rule); background:#fff; border-radius:14px; padding:9px 10px; font-weight:800; font-size:14px; cursor:pointer; transition:all .15s; text-align:center; line-height:1.25;}
  .choice:hover:not(:disabled){border-color:#a5b4fc;} .choice:disabled{cursor:default;}
  .choice.right{border-color:var(--best); background:var(--best-soft); color:#166534;}
  .choice.wrong{border-color:var(--hi); background:var(--hi-soft); color:#9f1239; animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}
  .nudge{border:2px solid var(--rule); background:#fff; border-radius:14px; padding:8px 6px; font-weight:800; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; position:relative; transition:all .15s;}
  .nudge:hover:not(:disabled){border-color:var(--line); color:var(--line);}
  .nudge:disabled{opacity:.4; cursor:not-allowed;}
  .nudge.hint{border-color:var(--best); background:var(--best-soft); color:#166534;}
  .nudge.hint::after{content:"clue says"; position:absolute; top:-9px; right:8px; font-size:10px; background:var(--best); color:#fff; padding:1px 6px; border-radius:99px; font-weight:800;}
  .meter{height:12px; border-radius:99px; background:#f1ece3; overflow:hidden;}
  .meter i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#fb923c,#e11d48); transition:width .35s;}
  .navrow{display:flex; gap:8px; align-items:center; justify-content:space-between; border-top:1px solid var(--rule); padding-top:12px; margin-top:auto;}
  .hintline{font-size:12.5px; color:var(--faint); font-weight:700; text-align:center; flex:1;}
  .btn-main{background:var(--line); color:#fff; border:0;}
  .btn-main:hover{background:#4338ca;}
  .btn-main:disabled,.btn-main[disabled]{background:#e7e2d9 !important; color:#a39a8b !important; border:0;}
  input[type=range]{accent-color:var(--line);}
  .preset{font-size:12.5px; font-weight:800; padding:6px 10px; border-radius:99px; border:1.5px solid var(--rule); background:#fff; cursor:pointer;}
  .preset:hover{border-color:var(--bot);} .preset.on{background:var(--bot); color:#fff; border-color:var(--bot);}
  .tag{border-radius:14px; padding:10px 12px; border:1px solid var(--rule);}
  .recap li{display:flex; gap:10px; align-items:flex-start; font-size:14px; font-weight:600; line-height:1.4;}
  .recap .n{flex:0 0 22px; height:22px; border-radius:50%; background:var(--line-soft); color:var(--line); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .tabnum{font-variant-numeric:tabular-nums;}
  .fade-in{animation:fadein .4s ease both;}
  #flashStage{display:none;}
  body.flashmode #flashStage{display:block;}
  body.flashmode #chartCard, body.flashmode #panelWrap, body.flashmode #cardsSec{display:none;}
  body.flashmode #mainGrid{grid-template-columns:minmax(0,1fr);}
  body.nomentor #mentorWrap{display:none;}
  body.wide #panelWrap{display:none;}
  body.wide #mainGrid{grid-template-columns:minmax(0,1fr);}
  .c1bar{display:none;}
  #cardsSec{grid-column:1/-1; order:2; min-width:0;}
  @media (min-width:1024px){
    body.wide #mainGrid{grid-template-columns:240px minmax(0,1fr);}
    body.wide #cardsSec{grid-column:auto; order:-1;}
    body.wide .cardshead{flex-direction:column; gap:2px;}
    body.wide .cards{grid-template-columns:1fr; gap:8px; padding:0;}
    body.wide .hcard{display:grid; grid-template-columns:78px minmax(0,1fr); column-gap:10px; row-gap:1px; align-items:center; padding:8px 10px;}
    body.wide .hcard .hsvg{grid-row:1/span 3; width:78px; height:56px;}
    body.wide .hcard>:not(.hsvg){grid-column:2;}
    body.wide .hcard .miss{grid-column:1/-1; margin-top:4px;}
  }
  .hcard.cur{border-color:var(--line); box-shadow:0 0 0 3px #e0e7ff;}
  .ansbox{display:inline-flex; align-items:center; gap:2px; border:2px solid var(--rule); border-radius:12px; padding:5px 10px; background:#fff; font-weight:800; font-size:16px; color:var(--soft);}
  .ansbox:focus-within{border-color:var(--line);}
  .ansbox input{width:52px; border:0; outline:0; font:inherit; color:var(--ink); text-align:center; background:transparent;}
  .ansbox.shake{animation:shake .3s;}
  @keyframes blink{50%{opacity:.35}} .blink{animation:blink 1.2s ease-in-out infinite;}
  body.c5 #cardsSec, body.c5 .navrow, body.c6 #cardsSec, body.c6 .navrow{display:none;}
  body.sim #cardsSec, body.sim #panelWrap{display:none;} body.sim #mainGrid{grid-template-columns:minmax(0,1fr);}
  body.sim .c1bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; border-top:1px solid var(--rule); margin-top:8px; padding-top:12px;}
  body.replay #c1Bar{min-height:112px; align-items:flex-start;}
  #eqBar{display:none;} body.showeq #eqBar{display:block;}
  body.wide .hcard.n8card{display:flex; flex-direction:column; align-items:stretch; padding:12px 14px;} body.wide .n8card .hsvg, .n8card .hsvg{width:100%; height:130px; grid-row:auto;} body.wide .n8card>*{grid-column:auto;} .n8card input[type=range]{accent-color:var(--line); margin:4px 0 6px;}
  .xslot{display:inline-block; min-width:1.2em; text-align:center; border-radius:6px; padding:0 3px; transition:background .3s;} .xslot.working{color:var(--faint); font-size:.85em;} .xslot.popnum{animation:popv .35s cubic-bezier(.3,1.5,.6,1); background:#eef2ff;}
  .storyico{flex:none; width:52px;} .storyico .hsvg{height:38px;}
  .storyend{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-radius:12px; padding:8px 12px; background:#f0fdf4; border:1px solid #bbf7d0;}
  .recapgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:6px 16px; font-size:13.5px; font-weight:700; color:var(--soft);}
  .recapgrid div{display:flex; gap:8px; align-items:flex-start;} .recapgrid .n{flex:none; width:20px; height:20px; border-radius:50%; background:#eef2ff; color:var(--line); font-size:11.5px; font-weight:800; display:grid; place-items:center;}
  @media (max-width:640px){ #c1Bar>*{flex-basis:100%;} }
  .eqstrip{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding:2px 4px 10px; margin-bottom:4px; border-bottom:1px dashed var(--rule);}
  .eqright{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .eqline{font-size:24px; font-weight:600; line-height:1.15; white-space:nowrap; word-spacing:2px;}
  .eqcap{font-size:11px; font-weight:800; color:var(--soft);}
  .eqn{display:inline-flex; flex-direction:column; align-items:center; line-height:1;} .eqn small{font-family:'Nunito'; font-size:10.5px; font-weight:800; color:var(--soft); margin-top:3px;}
  @media (min-width:1024px){ body.c6 #mainGrid{grid-template-columns:minmax(0,1fr) 380px;} }
  .cm{color:#7c3aed;} .cb{color:#0891b2;}
  .eqnum{display:inline-flex; flex-direction:column; align-items:center; line-height:1;} .eqnum small{font-family:'Nunito'; font-size:12px; font-weight:800; margin-top:6px; color:var(--soft);}
  .slot{border-radius:10px; padding:0 4px; margin:0 -4px; transition:background .3s, box-shadow .3s;}
  .slot.glow-m{background:#ede9fe; box-shadow:0 0 0 3px #c4b5fd;} .slot.glow-b{background:#cffafe; box-shadow:0 0 0 3px #67e8f9;}
  .flynum{position:fixed; z-index:70; font-family:'Fredoka'; font-weight:600; pointer-events:none; transition:transform .8s cubic-bezier(.5,0,.2,1), opacity .2s ease .75s; transform-origin:0 0;}
  .plugrow{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; font-size:14.5px;} .plugrow .ans{width:76px; flex:none;}
  .ans{width:84px; border:2px solid var(--rule); border-radius:10px; padding:5px 8px; font:inherit; text-align:center; background:#fff;}
  .ans:focus{outline:0; border-color:var(--line);} .ans.ok{border-color:#16a34a; background:#dcfce7; color:#166534;} .ans.bad{border-color:var(--hi); animation:shake .3s;}
  .dtab{table-layout:fixed; min-width:560px;} .dtab th,.dtab td{padding:9px 10px; text-align:right; border-bottom:1px dashed var(--rule); white-space:nowrap;} .dtab th{font-weight:800;} .dtab .tl{text-align:left;}
  .dtab .avg td{border-top:2px solid var(--rule); border-bottom:0;} .dtab .hl{background:#faf9ff;}
  .cell{opacity:0; display:inline-block; transition:opacity .25s;} .cell.on{opacity:1;}
  .cell.formula{color:var(--faint); font-size:13px; font-weight:800;}
  .cell.res{animation:popv .32s cubic-bezier(.3,1.5,.6,1);} @keyframes popv{0%{transform:scale(.5); opacity:0} 100%{transform:scale(1); opacity:1}}
  .dtab tr.calcrow td{background:#f6f5ff;} .dtab tr.calcrow td.hl{background:#eeeaff;}
  .dtab .src{box-shadow:inset 0 0 0 2px #a5b4fc; border-radius:8px; transition:box-shadow .2s;} .dtab td{transition:background .25s;}
  .avgv{font-family:'Fredoka'; font-weight:600; font-size:24px; opacity:0; transition:opacity .4s;} .avgv.on{opacity:1;}
  @media (min-width:1024px){ body.c5 #mainGrid{grid-template-columns:minmax(0,1fr) 240px;} body.c5 #panelWrap{padding:16px;} }
  .mathbox{background:#f6f5ff; border:1px solid #e0e7ff; border-radius:12px; padding:10px 12px; font-weight:700; font-size:14px; line-height:1.6;}
  #scoreStage{display:none;} body.nochart #scoreStage{display:block;} body.nochart #chartCard, body.nochart #panelWrap, body.nochart #cardsSec{display:none;}
  body.nochart #mainGrid{grid-template-columns:minmax(0,1fr);}
  .ohouse{display:grid; grid-template-columns:minmax(0,1fr); gap:20px 32px; align-items:center;} .ohouse>*{min-width:0;} @media (min-width:900px){ .ohouse{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);} }
  .ohouse-pic{border-radius:20px; background:linear-gradient(180deg,#eef2ff,#fff7ed); padding:18px 18px 6px;} .ohouse-pic .hsvg{width:100%; height:auto; max-height:340px;}
  .stat{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px dashed var(--rule); font-weight:700; color:var(--soft); font-size:15px;}
  .stat b{font-size:24px; font-weight:800; white-space:nowrap;}
  .hdots{display:flex; gap:6px;} .hdots i{width:26px; height:6px; border-radius:3px; background:#e7dccb;} .hdots i.on{background:var(--line);} .hdots i.cur{background:#a5b4fc;}
  .sqrow{display:grid; grid-template-columns:48px 1fr auto auto; gap:6px 14px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--rule); font-weight:700;}
  .sqrow .hsvg{width:48px; height:34px;}
  /* calculator */
  body{padding-bottom:84px;} body.nocalc .calc-fab, body.nocalc .calc{display:none;}
  .calc-fab{position:fixed; right:18px; bottom:18px; z-index:60; width:52px; height:52px; border-radius:16px; background:var(--line); color:#fff; display:grid; place-items:center; border:0; cursor:pointer; box-shadow:0 10px 24px -10px rgba(79,70,229,.8);}
  .calc-fab:hover{filter:brightness(1.08);}
  .calc{position:fixed; right:18px; bottom:80px; z-index:60; width:236px; background:#fff; border:1px solid var(--rule); border-radius:18px; padding:12px; box-shadow:0 20px 40px -18px rgba(30,36,51,.45); display:none;}
  .calc.open{display:block;}
  .calc-disp{background:#f6f5ff; border-radius:12px; padding:8px 12px; text-align:right; min-height:58px;}
  .calc-expr{font-size:12.5px; color:var(--faint); font-weight:700; min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .calc-val{font-size:24px; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  .calc-keys{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px;}
  .calc-keys button{height:40px; border-radius:10px; border:1px solid var(--rule); background:#fff; font-weight:800; font-size:16px; cursor:pointer; color:var(--ink);}
  .calc-keys button:hover{background:#f6f5ff;} .calc-keys button.op{color:var(--line); background:#f6f5ff;} .calc-keys button.op:hover{background:#e0e7ff;} .calc-keys button.eq{background:var(--line); color:#fff; border-color:var(--line);} .calc-keys button.eq:hover{background:#4338ca;}
  .calc-use{margin-top:8px; width:100%;}
  .mchip{font-weight:800; font-size:14.5px; padding:6px 12px; border-radius:999px;}
  .mchip.hi{background:var(--hi-soft); color:#9f1239;} .mchip.lo{background:var(--lo-soft); color:#92400e;}
  .sstep{border-top:1px solid var(--rule); padding-top:14px; margin-top:16px;}
  .slabel{font-size:12px; font-weight:800; color:var(--soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .namebox{margin-top:16px; border-radius:16px; padding:16px 18px; background:#f6f5ff; border:1px solid #e0e7ff;}
  body.wide .c1bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; border-top:1px solid var(--rule); margin-top:8px; padding-top:12px;}
  .flash{border:1.5px solid var(--rule); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; background:linear-gradient(180deg,#f6f5ff,#fff 60%);}
  .flash-house{width:62%; margin:0 auto;}
  .flash-house .hsvg{width:100%; height:auto;}
  .flash-price{font-size:34px; font-weight:800; color:var(--line); line-height:1.1;}
  .popin{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;}
  @keyframes popin{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
  .drawline{stroke-dasharray:1; stroke-dashoffset:1; animation:drawline .8s ease-out forwards;}
  @keyframes drawline{to{stroke-dashoffset:0}}
  .kbd-row{display:flex; align-items:center; gap:6px; justify-content:space-between;}
  .mini{border:1.5px solid var(--rule); background:#fff; border-radius:10px; width:34px; height:30px; font-weight:800; cursor:pointer;}
  .mini:hover{border-color:var(--line); color:var(--line);}
</style>
</head>
<body>
<div class="max-w-[1320px] mx-auto px-4 lg:px-6 py-4 lg:py-5 flex flex-col gap-4">

  <!-- header -->
  <header class="flex flex-col gap-3">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#4f46e5"/><path d="M8 17 L17 9 L26 17 V26 H8 Z" fill="#fff"/><rect x="14.5" y="19" width="5" height="7" fill="#4f46e5"/></svg>
        <div class="min-w-0">
          <h1 class="text-[20px] lg:text-[22px] font-semibold leading-tight">The Realtor Story</h1>
          <div class="text-[13px] font-bold text-[color:var(--soft)] truncate">How a machine learns the best price line</div>
        </div>
      </div>

<script>
/* ---------- data + plain math ---------- */
const HOUSES=[
  {s:850, p:190, body:'#f6bd60', roof:'#c2703d'},
  {s:1450,p:250, body:'#a7c4a0', roof:'#5b7f61'},
  {s:2050,p:355, body:'#f5cac3', roof:'#b5656b'},
  {s:2650,p:440, body:'#9ec5e8', roof:'#4a6f99'},
  {s:3250,p:560, body:'#e9d8a6', roof:'#9b7b3a'}
];
const MID=2050;
const u=s=>(s-MID)/1000;                       // how far from the middle house, in 1,000s of sq ft
const guess=(L,s)=>L.lv+L.tl*u(s);             // lv: price at the middle house, tl: extra $k per 1,000 sq ft
const fromTags=(a,b)=>({lv:(a+b)/2, tl:(b-a)/2.4});
const misses=L=>HOUSES.map(h=>guess(L,h.s)-h.p);   // + means guessed too high
const badness=L=>misses(L).reduce((t,e)=>t+e*e,0)/HOUSES.length; // mean squared error
const mean=a=>a.reduce((t,v)=>t+v,0)/a.length;
const clues=L=>{const e=misses(L); const avg=mean(e); const t=mean(e.map((v,i)=>v*u(HOUSES[i].s))); return {avg, t, gap:t/0.72*1.2};}
const BEST=(()=>{const xs=HOUSES.map(h=>u(h.s)), ys=HOUSES.map(h=>h.p); const my=mean(ys); const tl=xs.reduce((t,x,i)=>t+x*(ys[i]-my),0)/xs.reduce((t,x)=>t+x*x,0); return {lv:my, tl};})();
const BESTBAD=badness(BEST);
const typical=L=>Math.sqrt(badness(L));
const fmtK=v=>{const r=Math.round(v); return (r<0?'-$':'$')+Math.abs(r).toLocaleString('en-US')+'k';};
const fmtN=v=>Math.round(v).toLocaleString('en-US');
const ruleText=L=>{const a=guess(L,850), per=L.tl; return `${fmtK(a)} for the 850 sq ft house, ${per>=0?'plus':'minus'} ${fmtK(Math.abs(per))} for every extra 1,000 sq ft`;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- state ---------- */
const CH=[
  {t:'Your first pricing line', s:'First line'},
  {t:'The sales come in', s:'Sales'},
  {t:'How bad is my line?', s:'How bad?'},
  {t:'How much to change?', s:'Change?'},
  {t:'Fixing the line', s:'Fixing'},
  {t:'Repeat the steps', s:'Repeat'},
  {t:'Simulate', s:'Simulate'},
  {t:'Price a new house', s:'New house'}
];
const FLASH=[0,4]; // flashcards: the smallest and the biggest house
const freshC1=()=>({i:0,g:[null,null],val:[null,null],line:false,placed:0,gLanded:0,lineAnim:false,landed:-1,flying:false});
const freshC3=(key='')=>({key,i:0,meas:[0,0,0,0,0],val:'',tries:0,hint:'',msg:'',just:-1});
const freshF=(key='')=>({key, step:0, part:1, tab:false, calcBusy:false, q:[null,null], k:0, val:'', tries:0, hint:'', msg:'', pushed:false, busy:false, before:0, after:0});
const freshIt=(key='')=>({key, L:null, step:1, phase:'', D:null, demoDone:false, tok:0, vis:{pred:[0,0,0,0,0],sold:[0,0,0,0,0],miss:[0,0,0,0,0],cPred:[0,0,0,0,0],cSold:[0,0,0,0,0],cMiss:[0,0,0,0,0]}, pop:null,
  alpha:0.2, n:100, simL:null, steps:0, trail:[], hist:[], simBusy:false, simDone:false, diverged:false});
const freshSc=()=>({stage:0,part:1,phase:'diff',i:0,val:'',tries:0,hint:'',msg:''});
const freshP=(key='')=>({key,val:{m:'',b:''},done:{m:false,b:false},tries:{m:0,b:0},fb:{m:'',b:''},pushed:false,busy:false,msg:''});
const fresh=()=>({it:freshIt(),p:freshP(),f:freshF(),sc:freshSc(),ch:0,maxCh:0,first:fromTags(270,410),c1:freshC1(),c2:{sold:false,justSold:false,flying:false,landed:-1},c3:freshC3(),revealed:[0,0,0,0,0],justRev:-1,squared:[0,0,0,0,0],justSq:-1,
  fix:null,fixFrom:'',q1:null,q2:null,nudges:0,fixHist:[],ghost:null,robot:null,robotFrom:'',newSize:2300,gut:null,peek:false,n8:0,n8v:'',n8tries:0,n8hint:'',n8x:true,saidBig:false});
let S=fresh();
const $=id=>document.getElementById(id);

/* ---------- avatars + houses ---------- */
const MENTOR_SVG=`<svg viewBox="0 0 60 60" width="54" height="54" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#ffe8cc"/><path d="M12 30c0-14 8-21 18-21s18 7 18 21c0 3-1 5-2 6l-2-13c-4 2-14 2-22-4l-6 17c-2-1-4-3-4-6z" fill="#5a3825"/><circle cx="30" cy="31" r="13" fill="#f2c29b"/><path d="M17 27c3-7 9-10 15-9 4 1 8 4 10 8-6 0-14-2-18-6-2 3-4 5-7 7z" fill="#5a3825"/><circle cx="25" cy="31" r="1.8" fill="#1e2433"/><circle cx="35" cy="31" r="1.8" fill="#1e2433"/><path d="M25.5 36.5c2.5 2.5 6.5 2.5 9 0" stroke="#1e2433" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="21.5" cy="35" r="2" fill="#f59e9e" opacity=".6"/><circle cx="38.5" cy="35" r="2" fill="#f59e9e" opacity=".6"/><path d="M14 58c2-9 8-13 16-13s14 4 16 13" fill="#4f46e5"/><rect x="27" y="45" width="6" height="5" fill="#fff"/></svg>`;
const ROBOT_SVG=`<svg viewBox="0 0 60 60" width="54" height="54" aria-hidden="true"><circle cx="30" cy="30" r="29" fill="#ccfbf1"/><line x1="30" y1="8" x2="30" y2="15" stroke="#0f766e" stroke-width="2.5"/><circle cx="30" cy="7" r="3" fill="#f97316"/><rect x="14" y="15" width="32" height="24" rx="8" fill="#14b8a6"/><rect x="18" y="20" width="24" height="13" rx="5" fill="#0f3d3a"/><circle cx="25" cy="26.5" r="3" fill="#5eead4"/><circle cx="35" cy="26.5" r="3" fill="#5eead4"/><rect x="11" y="23" width="3" height="8" rx="1.5" fill="#0f766e"/><rect x="46" y="23" width="3" height="8" rx="1.5" fill="#0f766e"/><rect x="18" y="41" width="24" height="14" rx="5" fill="#14b8a6"/><rect x="25" y="45" width="10" height="5" rx="2" fill="#0f3d3a"/></svg>`;
function houseSVG(i,size,sign){
  const h=HOUSES[i]||{body:'#c4b5fd',roof:'#6d28d9'}; const f=clamp((size-700)/2900,0,1);
  const bw=34+f*40, bh=21+f*12, x0=46-bw/2, yb=62, peak=yb-bh-13-f*6;
  let w=''; const k=2+Math.round(f*2);
  for(let j=0;j<k;j++){const cx=x0+bw*(j+.5)/k; if(Math.abs(cx-46)<7) continue; w+=`<rect x="${cx-3.5}" y="${yb-bh+5}" width="7" height="6.5" rx="1" fill="#fff" stroke="#1e2433" stroke-opacity=".25"/>`;}
  let sg='';
  if(sign==='sale') sg=`<g><line x1="88" y1="62" x2="88" y2="38" stroke="#6b5b45" stroke-width="2"/><rect x="74" y="36" width="26" height="11" rx="2" fill="#4f46e5"/><text x="87" y="43.6" font-size="5" text-anchor="middle" fill="#fff" font-weight="800" font-family="Nunito">FOR SALE</text></g>`;
  if(sign==='sold'||sign==='solddrop') sg=`<g class="sold ${sign==='solddrop'?'drop':''}"><line x1="88" y1="62" x2="88" y2="38" stroke="#6b5b45" stroke-width="2"/><rect x="77" y="35" width="22" height="12" rx="2" fill="#e11d48"/><text x="88" y="43.6" font-size="7" text-anchor="middle" fill="#fff" font-weight="800" font-family="Nunito">SOLD</text></g>`;
  return `<svg class="hsvg" viewBox="0 0 100 70" aria-hidden="true"><ellipse cx="50" cy="63" rx="48" ry="3.5" fill="#e9e2d4"/>
  <rect x="${x0}" y="${yb-bh}" width="${bw}" height="${bh}" fill="${h.body}" stroke="#1e2433" stroke-opacity=".2"/>
  <polygon points="${x0-4},${yb-bh+1} 46,${peak} ${x0+bw+4},${yb-bh+1}" fill="${h.roof}"/>
  <rect x="42.5" y="${yb-12}" width="7" height="12" rx="1" fill="#7c4a2d"/>${w}${sg}</svg>`;
}

/* ---------- chart ---------- */
const svg=$('chart');
let W=640,H=400; const M={l:54,r:14,t:14,b:42};
const XD=[500,3600], YD=[0,700];
const X=s=>M.l+(s-XD[0])/(XD[1]-XD[0])*(W-M.l-M.r);
const Y=p=>M.t+(1-(p-YD[0])/(YD[1]-YD[0]))*(H-M.t-M.b);
const invY=py=>YD[0]+(1-(py-M.t)/(H-M.t-M.b))*(YD[1]-YD[0]);
const invX=px=>XD[0]+(px-M.l)/(W-M.l-M.r)*(XD[1]-XD[0]);
function lineEl(L,color,w=3,extra=''){return `<line x1="${X(XD[0])}" y1="${Y(guess(L,XD[0]))}" x2="${X(XD[1])}" y2="${Y(guess(L,XD[1]))}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;}

function chartOpts(){
  const c=S.ch;
  if(c===0) return {main:S.c1.line?S.first:null, mainColor:'var(--line)', c1:true};
  if(c===1) return {main:S.first, mainColor:'var(--line)'};
  if(c===2) return {main:S.first, mainColor:'var(--line)'};
  if(c===3) return {main:S.fix, mainColor:'var(--line)', miss:[1,1,1,1,1], ghostL:(S.f.q.every(v=>v&&!v.startsWith('wrong')))?c5Target(S.fix):null};
  if(c===4) return {main:S.fix, mainColor:'var(--line)', miss:[1,1,1,1,1], start:(S.p.busy||S.p.pushed)?S.first:null};
  if(c===5) return {main:S.it.L||S.first, mainColor:'var(--line)', miss:S.it.vis.miss, start:S.first};
  if(c===6) return {main:simL(), mainColor:'var(--line)', miss:[1,1,1,1,1], trail:S.it.trail, start:S.first};
  return {main:BEST, mainColor:'var(--line)', newHouse:true};
}
function renderChart(){
  const cw=svg.clientWidth||640; W=Math.max(300,cw); const wide=['wide','c5','c6','sim'].some(c=>document.body.classList.contains(c)); H=Math.round(wide?clamp(W*0.46,300,540):clamp(W*0.6,270,430));
  const narrow=W<520; NARROW=narrow; M.l=narrow?44:54;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  const o=chartOpts(); let s='';
  s+=`<defs><clipPath id="plot"><rect x="${M.l}" y="${M.t}" width="${W-M.l-M.r}" height="${H-M.t-M.b}"/></clipPath></defs>`;
  for(let p=0;p<=700;p+=100){ if(narrow&&p%200) continue; s+=`<line x1="${M.l}" x2="${W-M.r}" y1="${Y(p)}" y2="${Y(p)}" stroke="#efe9df"/><text x="${M.l-8}" y="${Y(p)+4}" font-size="11.5" text-anchor="end" fill="#9aa3b2" font-weight="700">$${p}k</text>`; }
  for(let x=1000;x<=3500;x+=500){ if(narrow&&x%1000) continue; s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${M.t}" y2="${H-M.b}" stroke="#f4efe6"/><text x="${X(x)}" y="${H-M.b+17}" font-size="11.5" text-anchor="middle" fill="#9aa3b2" font-weight="700">${x.toLocaleString('en-US')}</text>`; }
  s+=`<text x="${(M.l+W-M.r)/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="#5b6476" font-weight="800">House size (sq ft)</text>`;
  s+=`<g clip-path="url(#plot)">`;
  // squares
  if(o.sq) HOUSES.forEach((h,i)=>{ if(!o.sq[i]) return; const g=guess(o.main,h.s), x=X(h.s), y1=Y(h.p), y2=Y(g); const side=Math.abs(y2-y1); if(side<1||(S.ch===5&&side>150)) return;
    const hi=g>h.p; const col=hi?'var(--hi)':'var(--lo)'; const left=x+side>W-M.r; const rx=left?x-side:x; const ry=Math.min(y1,y2);
    const e=g-h.p;
    s+=`<rect class="${S.justSq===i&&S.ch===3?'grow':''}" style="${left?'transform-origin:100% 0':''}" x="${rx}" y="${ry}" width="${side}" height="${side}" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-opacity=".55" stroke-width="1.5"/>`;
    if(side>34 && S.ch===3) s+=`<text x="${rx+side/2}" y="${ry+side/2+4}" font-size="11" text-anchor="middle" fill="${hi?'#9f1239':'#92400e'}" font-weight="800">${fmtN(Math.round(Math.abs(e))**2)}</text>`;
  });
  if(o.trail) o.trail.slice(-25).forEach((L,j,arr)=>{ s+=lineEl(L,'var(--line)',2,`opacity="${0.06+0.3*(j+1)/arr.length}"`); });
  if(o.start && S.ch>=4) s+=lineEl(o.start,'#9aa3b2',2.5,'stroke-dasharray="6 6"');
  if(o.ghostL) s+=lineEl(o.ghostL,'#16a34a',3,'opacity=".55" stroke-dasharray="6 6" class="blink"');
  if(o.main) s+=lineEl(o.main,o.mainColor,4,S.ch===0&&S.c1.lineAnim?'class="drawline" pathLength="1"':'');
  // miss lines
  if(o.miss) HOUSES.forEach((h,i)=>{ if(!o.miss[i]) return; const g=guess(o.main,h.s); const col=g>h.p?'var(--hi)':'var(--lo)';
    s+=`<line x1="${X(h.s)}" x2="${X(h.s)}" y1="${Y(h.p)}" y2="${Y(g)}" stroke="${col}" stroke-width="3" class="${S.ch===5&&S.it.phase==='miss'?'fadein':''}"/>`;
    if(S.ch<=6 && !(S.ch>=2&&NARROW) && Math.abs(Y(g)-Y(h.p))>18 && !(o.sq&&o.sq[i])){ const my=(Y(g)+Y(h.p))/2; s+=`<text x="${X(h.s)-7}" y="${my+4}" font-size="11.5" text-anchor="end" fill="${g>h.p?'#9f1239':'#92400e'}" font-weight="800">${fmtK(Math.abs(g-h.p))}</text>`; }
  });
  if(o.guessDots) HOUSES.forEach(h=>{ s+=`<circle cx="${X(h.s)}" cy="${Y(guess(o.main,h.s))}" r="5" fill="#fff" stroke="${o.mainColor}" stroke-width="2.5"/>`; });
  if(o.real) HOUSES.forEach((h,i)=>{ if(!o.real[i]) return; s+=`<circle class="${S.ch===1&&S.justRev===i?'fadein':''}" cx="${X(h.s)}" cy="${Y(h.p)}" r="6.5" fill="var(--real)" stroke="#fff" stroke-width="2"/>`; });
  if(o.pivot){ const x=X(MID), y=Y(guess(o.main,MID)); s+=`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--line)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 3"/>`; }
  // new house marker
  if(o.newHouse){ const x=X(S.newSize); s+=`<line x1="${x}" x2="${x}" y1="${M.t}" y2="${H-M.b}" stroke="#f97316" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`; }
  s+=`</g>`;
  // ch1: each house drawn on the chart at its price (your two guesses, then the ones your line priced)
  if(o.c1){ const C=S.c1;
    const houseAt=(hi,p,label,kind,pop)=>{ const h=HOUSES[hi], x=X(h.s), y=Y(p);
      const art=houseArt(hi,'sale',x,y-66);
      const tag=kind==='guess'
        ? `<rect x="${x-34}" y="${y-96}" width="68" height="24" rx="8" fill="var(--line)"/><text x="${x}" y="${y-79}" font-size="13.5" text-anchor="middle" fill="#fff" font-weight="800">${label}</text>`
        : `<text x="${x}" y="${y-76}" font-size="13.5" text-anchor="middle" fill="var(--line)" font-weight="800">${label}</text>`;
      return `<g class="${pop?'popin':''}" style="transform-origin:${x}px ${y}px">${kind==='guess'?'':`<line x1="${x}" x2="${x}" y1="${H-M.b}" y2="${y}" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".35"/>`}
        ${art}<circle cx="${x}" cy="${y}" r="${kind==='guess'?6.5:5.5}" fill="${kind==='guess'?'#fff':'var(--line)'}" stroke="${kind==='guess'?'var(--line)':'#fff'}" stroke-width="${kind==='guess'?3:2}"/>${tag}</g>`; };
    FLASH.forEach((hi,k)=>{ if(C.g[k]==null||k>=C.gLanded) return; s+=houseAt(hi,C.g[k],fmtK(C.g[k]),'guess',hi===C.landed); });
    if(C.line) [1,2,3].slice(0,C.placed).forEach(hi=>{ s+=houseAt(hi,guess(S.first,HOUSES[hi].s),fmtK(guess(S.first,HOUSES[hi].s)),'line',hi===C.landed); });
  }
  // ch2: every house stays on the plot. Unsold: the whole house with a FOR SALE sign on your line.
  // Sold: the house moves to its real price with a SOLD sign, and its spot on your line keeps just a FOR SALE sign.
  if(S.ch===1||S.ch>=3&&S.ch<=6) HOUSES.forEach((h,i)=>{ const x=X(h.s), pred=Math.round(guess(S.ch===5?(S.it.L||S.first):S.ch===6?simL():S.ch>=3?S.fix:S.first,h.s)), yl=Y(pred); if(!isFinite(yl)||Math.abs(yl)>5000) return;
    const V=S.ch===5?S.it.vis:null, PP=S.ch===5?S.it.pop:null; if(V&&!V.pred[i]) return;
    if(S.ch===1&&!S.revealed[i]){
      s+=`<g>${houseArt(i,'sale',x,yl-66)}<circle cx="${x}" cy="${yl}" r="5.5" fill="var(--line)" stroke="#fff" stroke-width="2"/>
        <text x="${x}" y="${yl-76}" font-size="13.5" text-anchor="middle" fill="var(--line)" font-weight="800">${fmtK(pred)}</text></g>`;
      return; }
    // once sold, no house drawings: a FOR SALE sign right at your line, a SOLD sign on the real price.
    // each sign sits on the side away from the miss bar between them.
    const y=Y(h.p), below=h.p<pred;
    if(S.ch===2&&!S.c3.meas[i]&&i===S.c3.i){ const my=(yl+y)/2;
      s+=`<g class="blink"><line x1="${x}" x2="${x}" y1="${yl}" y2="${y}" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 4"/><circle cx="${x-17}" cy="${my}" r="11" fill="#1e2433"/><text x="${x-17}" y="${my+5}" font-size="14" text-anchor="middle" fill="#fff" font-weight="800">?</text></g>`; }
    const sold=!V||V.sold[i], up=sold?below:false;
    s+=`<g class="${PP&&PP.t==='pred'&&PP.i===i?'popin':''}" style="transform-origin:${x}px ${yl}px">${signAt(x,yl,up,'FOR SALE','var(--line)',fmtK(pred),'var(--line)')}</g>`;
    if(sold) s+=`<g class="${(S.ch===1&&i===S.c2.landed)||(PP&&PP.t==='sold'&&PP.i===i)?'popin':''}" style="transform-origin:${x}px ${y}px">${signAt(x,y,!below,'SOLD','#e11d48',fmtK(h.p),'var(--real)')}</g>`; });
  if(S.ch===7){ const P8=n8Prices(), x=X(S.newSize), y=Y(P8.ans);

  update(); S.justRev=-1; }
function square(i){ if(S.squared[i]) return; S.squared[i]=1; S.justSq=i; const e=Math.abs(Math.round(misses(S.first)[i])); const n=S.squared.reduce((a,b)=>a+b,0);

function renderScore(){

    else h+=`<div class="sstep"><div class="slabel">Average the squares</div>
        <div class="text-[16px] font-bold tabnum">(${sq.map(fmtN).join(' + ')}) ÷ 5 = <b style="color:var(--ink)">${fmtN(mse)}</b></div></div>

function scSquares(){ return misses(S.first).map(e=>{ const m=Math.round(Math.abs(e)); return m*m; }); }
function avgCheck(){ const T=S.sc, sq=scSquares(), sum=sq.reduce((a,b)=>a+b,0), mse=sum/5, v=parseFloat(String(T.val).replace(/[^0-9.]/g,''));
  if(isNaN(v)){ T.hint='Type a number.'; update(); $('scIn')?.focus({preventScroll:true}); return; }
  if(Math.abs(v-mse)<=1) return avgAccept(false);
  T.tries++;
  T.hint=Math.abs(v-sum)<=1?`That's the total. Now divide it by 5.`:T.tries===1?`Not quite. Add the 5 squares first, then divide by 5.`:`${sq.map(fmtN).join(' + ')} = ${fmtN(sum)}. Now ${fmtN(sum)} ÷ 5 = ?`;
  update(); $('scIn')?.focus({preventScroll:true}); }
function avgAccept(shown){ const T=S.sc; T.stage=3; T.msg=''; T.val=''; T.tries=0; T.hint=''; update(); }
function scMiss(i){ return Math.round(Math.abs(misses(S.first)[i])); }
function scCheck(){ const T=S.sc, i=T.i, m=scMiss(i), v=parseFloat(String(T.val).replace(/[^0-9.]/g,''));
  if(isNaN(v)){ T.hint='Type a number.'; update(); $('scIn')?.focus({preventScroll:true}); return; }
  if(T.phase==='diff'){
    if(v===m) return scAccept(false);
    T.tries++; const g=Math.round(guess(S.first,HOUSES[i].s)), p=HOUSES[i].p;
    T.hint=T.tries===1?'Not quite. Take the bigger price minus the smaller one.':`${Math.max(g,p)} − ${Math.min(g,p)} = ?`;
  } else {

      <div class="flex gap-1.5" aria-hidden="true">${FLASH.map((_,j)=>`<i style="width:9px;height:9px;border-radius:50%;display:inline-block;background:${j<=k?'var(--line)':'var(--rule)'}"></i>`).join('')}</div></div>
    <div class="flash popin">
      <div class="flash-house">${houseSVG(hi,h.s,'sale')}</div>
      <div class="text-center text-[15px] font-extrabold">${h.s.toLocaleString('en-US')} sq ft</div>
      <div class="text-center text-[13.5px] font-bold text-[color:var(--soft)]">What do you think it sold for?</div>
      <div class="text-center flash-price tabnum" id="flashVal">${C.val[k]==null?'<span style="color:var(--faint)">Pick a price</span>':fmtK(C.val[k])}</div>
      <div class="flex items-center gap-2"><button class="mini" data-fd="-10" aria-label="Lower guess">−</button>
        <input type="range" min="0" max="700" step="5" value="${C.val[k]??0}" id="flashRange" class="range range-sm flex-1" aria-label="Your price guess for the ${h.s.toLocaleString('en-US')} sq ft house">
        <button class="mini" data-fd="10" aria-label="Raise guess">+</button></div>
    </div>
    ${k===1?`<div class="text-[13px] font-bold text-[color:var(--soft)]">Your first guess: ${fmtK(C.g[0])} for the ${HOUSES[FLASH[0]].s.toLocaleString('en-US')} sq ft house.</div>`:''}
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="text-[13px] font-bold text-[color:var(--faint)]">No wrong answers yet. Go with your gut.</p>
      <button class="btn btn-main" id="lockGuess" ${C.val[k]==null?'disabled':''}>${k===0?'Lock in my guess':'Lock in and plot my guesses'}</button>
    </div>
  </div>`;
  const setV=v=>{ C.val[k]=clamp(Math.round(v/5)*5,5,700); $('flashRange').value=C.val[k]; $('flashVal').textContent=fmtK(C.val[k]); $('lockGuess').disabled=false; };
  $('flashRange').oninput=()=>setV(+$('flashRange').value);
  $('flashStage').querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>setV((C.val[k]??0)+(+b.dataset.fd)));
  $('lockGuess').onclick=()=>{ if(C.val[k]==null) return; C.g[k]=C.val[k];
    if(k===0){ C.i=1; say(`Got it: ${fmtK(C.g[0])}. Now the biggest house. <b>What do you think it sold for?</b>`); renderFlash(); return; }
    C.i=2; startReveal(); };
}

const sleep=ms=>new Promise(res=>setTimeout(res,ms));
const redrawC1=()=>{ P[0].enter(); $('panel').innerHTML=P[0].html(); P[0].wire(); update(); };
// Your two guessed houses fly from their cards onto the chart, then the line draws itself through them.
async function startReveal(){
  const C=S.c1; C.gLanded=0; redrawC1();
  document.getElementById('cardsSec').scrollIntoView({behavior:'smooth',block:'nearest'});
  await sleep(450);
  for(let k=0;k<2;k++){
    if(S.ch!==0||S.c1!==C) return;
    await flyTo(FLASH[k],C.g[k]); if(S.ch!==0||S.c1!==C) return;
    C.gLanded=k+1; C.landed=FLASH[k]; update(); C.landed=-1; await sleep(300);
  }
  await sleep(300); if(S.ch!==0||S.c1!==C) return;
  S.first=fromTags(C.g[0],C.g[1]); C.line=true; C.lineAnim=true; C.placed=0; redrawC1();
  await sleep(900); if(S.ch!==0||S.c1!==C) return;
  C.lineAnim=false; update();
}
// Each remaining house flies from its card in the neighborhood down onto its dot on your line.
async function flyTo(hi,price,hangBelow=false,toSign=false){
  const h=HOUSES[hi], src=document.querySelector(`.hcard[data-i="${hi}"] .hsvg`);
  const pt=svg.createSVGPoint(); pt.x=X(h.s); pt.y=Y(price); const to=pt.matrixTransform(svg.getScreenCTM());
  if(!src){ return; }
  const from=src.getBoundingClientRect(), ghost=src.cloneNode(true);
  Object.assign(ghost.style,{position:'fixed',left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`,zIndex:60,pointerEvents:'none',
    transition:'transform .9s cubic-bezier(.45,.05,.3,1)',transformOrigin:'center'});
  document.body.appendChild(ghost); src.style.opacity=.25;
  const drawn=Math.min(from.width,from.height*100/70); // the drawing inside the card's svg box
  const ctmS=svg.getScreenCTM().a, landY=toSign?to.y:hangBelow?to.y+(8+33.5)*ctmS:to.y-32.5*ctmS;
  try{ await sleep(30); ghost.style.transform=`translate(${to.x-(from.left+from.width/2)}px, ${landY-(from.top+from.height/2)}px) scale(${(toSign?30:96)*ctmS/drawn})`; if(toSign){ ghost.style.transition+=', opacity .25s ease .7s'; ghost.style.opacity=0; } await sleep(950); }
  finally{ ghost.remove(); src.style.opacity=''; }
}
async function predictNext(){
  const C=S.c1; if(C.flying||!C.line) return; C.flying=true; redrawC1();
  document.getElementById('cardsSec').scrollIntoView({behavior:'smooth',block:'nearest'});
  await sleep(350);
  for(const hi of [1,2,3]){
    if(S.ch!==0||S.c1!==C) return;
    await flyTo(hi,guess(S.first,HOUSES[hi].s)); if(S.ch!==0||S.c1!==C) return;
    C.placed=hi; C.landed=hi;
    say(`The ${HOUSES[hi].s.toLocaleString('en-US')} sq ft house: go up from its size to your line, and it says <b>${fmtK(guess(S.first,HOUSES[hi].s))}</b>.`);
    update(); C.landed=-1; await sleep(350);
  }
  C.flying=false; redrawC1();
}

function renderC1Bar(){
  const C=S.c1, bar=$('c1Bar');
  if(!C.line){ bar.innerHTML=`<span class="text-[14px] font-bold text-[color:var(--soft)]">Two points make a line. Drawing yours...</span>`; return; }
  if(C.placed<3){ bar.innerHTML=`<span class="text-[14px] font-bold">This is your <span style="color:var(--line)">pricing line</span>: find a house's size, go up to the line, read the price.</span>
    <span class="flex gap-2">${C.flying?'':'<button class="btn btn-ghost btn-sm" id="c1Redo">Change my guesses</button>'}<button class="btn btn-main" id="c1Predict" ${C.flying?'disabled':''}>${C.flying?'Predicting...':'Now predict the next houses'}</button></span>`; }
  else bar.innerHTML=`<span class="text-[14px] font-bold">Your line: <span style="color:var(--line)">${ruleText(S.first)}</span></span>
    <span class="flex gap-2"><button class="btn btn-ghost btn-sm" id="c1Redo">Change my guesses</button><button class="btn btn-main" id="c1Next">Next: the sales come in &rarr;</button></span>`;
  if($('c1Predict')&&!C.flying) $('c1Predict').onclick=predictNext;
  if($('c1Redo')) $('c1Redo').onclick=()=>{ const v=[...C.val]; S.c1=freshC1(); S.c1.val=v; S.maxCh=0; P[0].enter(); $('panel').innerHTML=P[0].html(); P[0].wire(); update(); renderProg(); };
  if($('c1Next')) $('c1Next').onclick=()=>{ go(1); window.scrollTo({top:0,behavior:'smooth'}); };
}

function renderC2Bar(){
  const D=S.c2, bar=$('c1Bar'), all=S.revealed.every(v=>v);
  if(all&&!D.flying){
    bar.innerHTML=`<span class="text-[14px] font-bold">All 5 sold. Some sold above your line, some below.</span>
      <button class="btn btn-main" id="c2Next">Next: how bad is my line? &rarr;</button>`;
    $('c2Next').onclick=()=>{ go(2); window.scrollTo({top:0,behavior:'smooth'}); }; return; }
  bar.innerHTML=`<span class="text-[14px] font-bold">Your line made a guess for every house. Now the real sales come in.</span>
    <button class="btn btn-main" id="c2Sold" ${D.flying?'disabled':''}>${D.flying?'Plotting the sales...':'See what they sold for'}</button>`;
  if(!D.flying) $('c2Sold').onclick=revealSales;
}
async function revealSales(){
  const D=S.c2; if(D.flying) return; D.flying=true; D.sold=true; D.justSold=true; S.revealed=[0,0,0,0,0]; update();
  document.getElementById('cardsSec').scrollIntoView({behavior:'smooth',block:'nearest'});
  await sleep(1100); if(S.ch!==1) { D.flying=false; return; }
  D.justSold=false; update();
  for(let i=0;i<HOUSES.length;i++){
    await flyTo(i,HOUSES[i].p,false,true); if(S.ch!==1){ D.flying=false; return; }
    S.revealed[i]=1; S.justRev=i; D.landed=i; update(); S.justRev=-1; D.landed=-1; await sleep(250);
  }
  D.flying=false; update();
}

/* ---------- navigation ---------- */
function renderProg(){ $('prog').innerHTML=CH.map((c,i)=>`<button class="pstep ${i<S.ch?'done':''} ${i===S.ch?'cur':''}" data-c="${i}" aria-label="Chapter ${i+1}: ${c.t}"><span class="pbar"><i></i></span><span class="plabel"><span class="lg:hidden">${i===S.ch?`${i+1}. ${c.s}`:i+1}</span><span class="hidden lg:inline">${i+1}. ${c.t}</span></span></button>`).join('');
  $('prog').querySelectorAll('.pstep').forEach(b=>b.onclick=()=>go(+b.dataset.c)); }
function fillUpTo(c){
  if(c>=1&&!(S.c1.line&&S.c1.placed>=3)){ S.c1={...freshC1(), i:2, g:[250,450], val:[250,450], line:true, placed:3, gLanded:2}; S.first=fromTags(250,450); }
  if(c>=2&&!S.revealed.every(v=>v)){ S.c2={sold:true,justSold:false,flying:false,landed:-1}; S.revealed=[1,1,1,1,1]; }
  const key=JSON.stringify(S.first);
  if(c>=3&&S.sc.stage<3){ S.sc={...freshSc(),stage:3,part:2}; S.squared=[1,1,1,1,1]; }
  if(c>=4&&(!S.f.tab||S.f.key!==key)){ S.f={...freshF(key),part:2,step:2,q:[qRight(0,S.first),qRight(1,S.first)],tab:true}; }
  if(c>=6&&(!S.it.demoDone||S.it.key!==key)){ S.it={...freshIt(key),L:gdTarget(S.first),demoDone:true,phase:'done',vis:{pred:[1,1,1,1,1],sold:[1,1,1,1,1],miss:[1,1,1,1,1],cPred:[1,1,1,1,1],cSold:[1,1,1,1,1],cMiss:[1,1,1,1,1]}}; S.it.D=gdData(S.it.L); }
  if(c>=7&&!S.it.simDone){ S.it.simDone=true; S.it.simL={...S.first}; S.it.hist=[badness(S.first)]; }
  if(c>=5&&(!S.p.pushed||S.p.key!==key)){ const D=gdData(S.first); S.p={...freshP(key),done:{m:true,b:true},pushed:true,fb:{m:`m goes from ${f1s(D.T.m)} to <b>${f1s(D.nm)}</b>.`,b:`b goes from ${f1s(D.T.b)} to <b>${f1s(D.nb)}</b>.`}}; }
}
function go(c){ fillUpTo(c); stopPlay(); S.ghost=null; S.ch=c; S.maxCh=Math.max(S.maxCh,c); P[c].enter(); $('panel').innerHTML=P[c].html(); P[c].wire(); update(); renderProg();
  const titles=['The neighborhood','The sales','How far off?','Your misses','Your misses','Running every step again','Your line as it learns','The new listing'];
  const hints=['Guess two, and your line prices the rest','Each house moves to the price it really sold for','How far each sale is from your line','Each miss, squared','','The line fills in as each step runs','Updates on every step','Set its size'];
  $('cardsTitle').textContent=titles[c]; $('cardsHint').textContent=hints[c]; $('chapChip').textContent=`Chapter ${c+1} of 8`; }
$('backBtn').onclick=()=>{ if(S.ch>0) go(S.ch-1); };
$('nextBtn').onclick=()=>{ if(S.ch<7&&P[S.ch].done()){ go(S.ch+1); window.scrollTo({top:0,behavior:'smooth'}); } };
function update(){ const fm=S.ch===0&&S.c1.i<2; document.body.classList.toggle('nomentor',true); document.body.classList.toggle('wide',(S.ch===0&&!fm)||S.ch===1||S.ch>=5); document.body.classList.toggle('sim',false); document.body.classList.toggle('showeq',(S.ch===0&&!fm)||S.ch>=4); document.body.classList.toggle('replay',S.ch===5); document.body.classList.toggle('nocalc',S.ch===7&&S.n8>=2); document.body.classList.toggle('c5',S.ch===3&&S.f.part===1); document.body.classList.toggle('c6',S.ch===4); document.body.classList.toggle('nochart',S.ch===2||(S.ch===3&&S.f.part===2)); const was=document.body.classList.contains('flashmode'); document.body.classList.toggle('flashmode',fm); if(fm&&(!was||!$('lockGuess'))) renderFlash();
  renderChart(); if(S.ch===0&&!fm){ renderEq(S.first,'Your pricing line equation',!S.c1.line); renderC1Bar(); } else if(S.ch===1) renderC2Bar(); else if(S.ch===2) renderScore(); else if(S.ch===3){ if(S.f.part===1) renderC5Bar(); else renderTable(); } else if(S.ch===4){ renderEq(); renderPlug(); } else if(S.ch===5){ renderEq(S.it.L||S.first,'Run back all the steps you did, on the new line you found'); renderC6Bar(); } else if(S.ch===6){ renderEq(simL(),'Simulate: repeat the loop many times'); renderSimBar(); } else if(S.ch===7){ renderEq(BEST,'Your final line'); renderC8Bar(); } $('cards').innerHTML=cardsFor(); if(S.ch===7&&$('n8SizeR')) $('n8SizeR').oninput=e=>{ S.newSize=+e.target.value; n8Refresh(); }; P[S.ch].upd();
  const d=P[S.ch].done(); const nb=$('nextBtn'); nb.disabled=S.ch===7||!d; nb.style.display=S.ch===7?'none':'';
  $('hintline').textContent=S.ch===7?P[7].hint:d?'':P[S.ch].hint; $('backBtn').disabled=S.ch===0;
  if(d&&S.ch<7&&S.maxCh===S.ch){ S.maxCh=S.ch+1; renderProg(); } }
/* ---------- calculator ---------- */
(function(){
  let expr='', shown='0', last=null;
  const KEYS=[['C','clr'],['⌫','back'],['÷','/'],['×','*'],['7'],['8'],['9'],['−','-'],['4'],['5'],['6'],['+','+'],['1'],['2'],['3'],['=','eq'],['0'],['00'],['.']];
  const calc=$('calc'), keys=$('calcKeys');
  keys.innerHTML=KEYS.map(([t,v])=>`<button data-k="${v??t}" class="${'+-*/'.includes(v??'_')?'op':v==='eq'?'eq':''}" ${v==='eq'?'style="grid-row:span 2;height:auto"':''}>${t}</button>`).join('');
  const pretty=e=>e.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/-/g,' − ').replace(/\+/g,' + ');
  const answerBox=()=>$('scIn')||$('n8In')||[$('pInm'),$('pInb')].find(e=>e&&!e.disabled)||null;
  function paint(){ $('calcExpr').textContent=last!=null&&expr===''?'':pretty(expr); $('calcVal').textContent=shown;
    $('calcUse').style.display=last!=null&&answerBox()?'':'none'; }
  function evaluate(e){ if(!/^[0-9.+\-*/]+$/.test(e)) return null; try{ const v=Function('"use strict";return ('+e+')')(); return isFinite(v)?Math.round(v*1e6)/1e6:null; }catch(_){ return null; } }
  function press(k){
    if(k==='clr'){ expr=''; shown='0'; last=null; }
    else if(k==='back'){ expr=expr.slice(0,-1); shown=expr?pretty(expr).trim().split(' ').pop()||'0':'0'; }
    else if(k==='eq'){ const v=evaluate(expr); if(v!=null){ last=v; shown=v.toLocaleString('en-US'); expr=''; } else shown='?'; }
    else { if(last!=null&&expr===''&&'+-*/'.includes(k)) expr=String(last); else if(last!=null&&expr==='') { last=null; }
      expr+=k; shown=pretty(expr).trim().split(' ').pop()||k; }
    paint(); }
  keys.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) press(b.dataset.k); });
  $('calcFab').onclick=()=>{ calc.classList.toggle('open'); paint(); };
  $('calcClose').onclick=()=>calc.classList.remove('open');
  $('calcUse').onclick=()=>{ const box=answerBox(); if(!box||last==null) return; box.value=String(last); box.dispatchEvent(new Event('input')); box.focus({preventScroll:true}); };
  document.addEventListener('keydown',e=>{ if(!calc.classList.contains('open')||e.target.tagName==='INPUT') return;
    const map={'Enter':'eq','=':'eq','Backspace':'back','Escape':null,'x':'*','X':'*'};
    if(e.key==='Escape'){ calc.classList.remove('open'); return; }
    const k=map[e.key]??(/^[0-9.+\-*/]$/.test(e.key)?e.key:undefined); if(k){ e.preventDefault(); press(k); } });
})();
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(update,80); });
say('');
go(0);
</script>
